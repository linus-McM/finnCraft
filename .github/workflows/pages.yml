# Publishes the app to GitHub Pages on every push to main.
# There is no compile step: the repository already is the finished site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/itacare-3d-gps-map-s3qp9u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject Google Places key
        env:
          KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "GOOGLE_PLACES_KEY secret not set; ratings stay optional"; exit 0; fi
          node -e "const fs=require('fs');fs.writeFileSync('config.js','window.ITACARE_CONFIG = '+JSON.stringify({googleKey:process.env.KEY})+';\n')"
          echo "Google key injected"
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # switch Pages on for the repo if it isn't yet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
