<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Itacaré · São Paulo 3D</title>
<meta name="description" content="3D terrain map of Itacaré (Bahia) and central São Paulo: trails, streets, markets, restaurants with Google ratings, live GPS and routes.">
<meta name="theme-color" content="#0b1d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0b1d26;
    --panel: rgba(11, 29, 38, 0.88);
    --text: #eef5f7;
    --muted: #9fb6bf;
    --accent: #ffb547;
    --gps: #2f8cff;
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; }

  /* Floating map labels (beaches, places) */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 12px; font-weight: 600;
    color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; padding-bottom: 6px; }
  .label::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: currentColor; box-shadow: 0 0 2px #000; }
  .label.beach { color: #ffe39a; }
  .label.place { color: #ffffff; font-size: 13px; }
  .label.poi { color: #9ff0ff; font-weight: 500; }
  .label.market { color: #ffd34d; font-weight: 700; }
  .label.pick { text-decoration: underline dotted; }

  /* Food & drink markers */
  #venues { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .venue { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; }
  .venue .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
    background: #fff; border: 2px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .venue .rt { margin-top: 2px; font-size: 10px; font-weight: 700; color: #1b1300; background: var(--rc, #ffd34d); border-radius: 6px;
    padding: 0 4px; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .venue .nm { font-size: 10px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000; white-space: nowrap; }
  .venue.sel .ic { transform: scale(1.3); border-color: #00e5ff; }
  .venue.pick .ic { box-shadow: 0 0 0 2px #ffd34d, 0 1px 4px rgba(0,0,0,.5); }
  .notes { margin: 6px 0; font-size: 13px; }
  .stars { color: #ffd34d; letter-spacing: 1px; }

  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 14px; }
  #top { top: calc(env(safe-area-inset-top) + 10px); left: 10px; right: 10px; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px; }
  #top h1 { font-size: 15px; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
  #btnArea { flex: none; padding: 5px 9px; font-size: 12px; white-space: nowrap; }
  #top h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #compass { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,.25);
    display: grid; place-items: center; cursor: pointer; flex: none; }
  #compass svg { width: 26px; height: 26px; }

  #controls { right: 10px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column;
    gap: 8px; background: none; border: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn svg { width: 24px; height: 24px; }
  .btn.on { background: var(--gps); border-color: var(--gps); }
  .btn.rec.on { background: #e5484d; border-color: #e5484d; }

  #sheet { left: 10px; bottom: calc(env(safe-area-inset-bottom) + 14px); width: min(360px, calc(100% - 80px));
    max-height: 55vh; overflow: auto; padding: 12px 14px; display: none; }
  #sheet.open { display: block; }
  #sheet h2 { font-size: 15px; margin: 0 0 4px; padding-right: 28px; }
  #sheet .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #sheet .close { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.08); color: var(--text); font-size: 16px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .stat { background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--muted); font-size: 11px; }
  #profile { width: 100%; height: 90px; display: block; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row label { display: flex; gap: 6px; align-items: center; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: none; color: var(--text); padding: 6px 10px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: #1b1300; font-weight: 600; }
  .list { margin: 6px 0 0; padding: 0; list-style: none; }
  .list li { padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .list li .sw { width: 14px; height: 4px; border-radius: 2px; flex: none; }
  .list li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .km { color: var(--muted); font-size: 12px; }
  .list li .pill.go { padding: 4px 8px; flex: none; }
  .rbadge { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 6px; font-weight: 700;
    font-size: 12px; color: #1b1300; background: var(--rc, #ffd34d); }
  .small { color: var(--muted); font-size: 11px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=search] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(0,0,0,.25); color: var(--text); font: inherit; }
  a { color: var(--accent); }
  .pill { text-decoration: none; display: inline-block; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06);
    color: var(--text); cursor: pointer; font: inherit; }

  #nav { position: fixed; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 70px); display: none; align-items: center;
    gap: 8px; padding: 8px 10px 8px 12px; border-color: rgba(0,255,136,.5); z-index: 4; }
  #nav .txt { flex: 1; min-width: 0; font-size: 13px; }
  #nav button { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.1); color: var(--text);
    cursor: pointer; flex: none; font-size: 14px; }
  .pill.go { background: #00ff88; color: #00351c; font-weight: 700; border-color: #00ff88; }
  .label { pointer-events: auto; cursor: pointer; }
  #attrib { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 2px); font-size: 9px; color: rgba(255,255,255,.75);
    text-shadow: 0 0 2px #000; pointer-events: none; }
  #toast { left: 50%; top: calc(env(safe-area-inset-top) + 124px); transform: translateX(-50%); padding: 8px 14px;
    max-width: calc(100% - 40px); text-align: center; display: none; z-index: 5; }
  #toast.show { display: block; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10;
    transition: opacity .4s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .box { text-align: center; }
  #loading .bar { width: 200px; height: 4px; background: var(--line); border-radius: 2px; margin: 12px auto 0; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>

<body>
<div id="view"></div>

<div id="top" class="panel">

  <button class="pill" id="btnArea" title="Switch area">⇄ Area</button>
  <div id="compass" title="Reset to north">

<div id="controls" class="panel">
  <button class="btn" id="btnLayers" title="Layers &amp; settings">

  <div class="small" id="loadmsg" style="margin-top:8px"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { MapControls } from './vendor/MapControls.js';
import { LineSegments2 } from './vendor/LineSegments2.js';
import { LineSegmentsGeometry } from './vendor/LineSegmentsGeometry.js';
import { LineMaterial } from './vendor/LineMaterial.js';
import { Line2 } from './vendor/Line2.js';
import { LineGeometry } from './vendor/LineGeometry.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Settings & small helpers
// ---------------------------------------------------------------------------
const TRAIL_LIFT = 2.5;                               // metres trails float above ground
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];

const CATEGORIES = {
  route:  { label: 'Hiking routes', color: 0xff4fd8, width: 5 },
  path:   { label: 'Paths & trails', color: 0xffb547, width: 3.5 },
  track:  { label: 'Dirt tracks', color: 0xd9a066, width: 3 },
  steps:  { label: 'Steps', color: 0xff6b6b, width: 3 },
  road:   { label: 'Roads & streets', color: 0xe8eef0, width: 1.6 },
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const savedSettings = store.get('itacare.settings', {});

// ---------------------------------------------------------------------------
// Areas. The whole app is the same for every area; only the terrain file, the
// OpenStreetMap query, the Google rating search boxes and a few labels change.
// The chosen area is remembered; ?area=saopaulo in the URL also selects it.
// ---------------------------------------------------------------------------
const REGIONS = {
  itacare: {
    name: 'Itacaré', title: 'Itacaré 3D Trails', blurb: 'Bahia: beaches, trails, restaurants',
    data: 'data', coast: true, center: { lat: -14.2786, lon: -38.9964 }, centerName: 'town',
    searchSuffix: 'Itacaré Bahia', osmCache: 'itacare-osm-v4', ratingsCache: 'itacare-ratings-v1',
    buildings: true, roads: 'all', routes: true, overpassTimeout: 90,
    ratingRects: [{ low: { latitude: -14.2960, longitude: -39.0040 }, high: { latitude: -14.2700, longitude: -38.9820 } }],
    loading: 'Building 3D Itacaré…',
  },
  saopaulo: {
    name: 'São Paulo', title: 'São Paulo 3D', blurb: 'Centro · Paulista · Pinheiros · Ibirapuera: markets, restaurants, sights',
    data: 'data/saopaulo', coast: false, center: { lat: -23.5505, lon: -46.6333 }, centerName: 'Sé',
    searchSuffix: 'São Paulo', osmCache: 'saopaulo-osm-v1', ratingsCache: 'saopaulo-ratings-v1',
    buildings: false, roads: 'streets', routes: false, overpassTimeout: 180, curated: 'data/saopaulo/places.json',
    // Google Text Search returns at most 60 places per box, so the busy districts are searched separately.
    ratingRects: [
      { low: { latitude: -23.5560, longitude: -46.6480 }, high: { latitude: -23.5330, longitude: -46.6250 } },   // Centro / Luz
      { low: { latitude: -23.5760, longitude: -46.6800 }, high: { latitude: -23.5500, longitude: -46.6400 } },   // Paulista / Jardins / Bixiga
      { low: { latitude: -23.5760, longitude: -46.7080 }, high: { latitude: -23.5440, longitude: -46.6800 } },   // Pinheiros / Vila Madalena
      { low: { latitude: -23.6080, longitude: -46.6950 }, high: { latitude: -23.5760, longitude: -46.6350 } },   // Itaim / Ibirapuera / Moema / Vila Mariana
    ],
    loading: 'Building 3D São Paulo…',
  },
};
const REGION_ID = (() => {
  const q = new URLSearchParams(location.search).get('area');
  const id = q && REGIONS[q] ? q : store.get('itacare.area', 'itacare');
  return REGIONS[id] ? id : 'itacare';
})();
const REGION = REGIONS[REGION_ID];
store.set('itacare.area', REGION_ID);
const TOWN = REGION.center;
function switchArea(id) {
  if (id === REGION_ID) return;
  store.set('itacare.area', id);
  location.href = location.pathname + (id === 'itacare' ? '' : '?area=' + id);
}
document.title = REGION.title;
$('title').textContent = REGION.title;
$('loadtitle').textContent = REGION.loading;
$('btnArea').textContent = '⇄ ' + Object.values(REGIONS).find((r) => r !== REGION).name;
const BUILT_IN_KEY = (window.ITACARE_CONFIG && window.ITACARE_CONFIG.googleKey) || '';
const settings = Object.assign({ layer: 'satellite', imagery: 'esri', hires: true, exaggeration: 1.5, minRating: 0, googleKey: '', routeMode: 'moped' }, savedSettings, {
  show: Object.assign({ route: true, path: true, track: true, steps: true, road: true, labels: true,
    restaurant: true, bar: true, cafe: true, buildings: true }, savedSettings.show),
});
const saveSettings = () => store.set('itacare.settings', settings);
// The key pasted in Layers wins; otherwise the one baked in at deploy time.
const googleKey = () => settings.googleKey || BUILT_IN_KEY;

let toastTimer;
function toast(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function setStatus(msg) { $('status').textContent = msg; }
function progress(p, msg) { $('loadbar').style.width = Math.round(p * 100) + '%'; if (msg) $('loadmsg').textContent = msg; }

const fmtKm = (m) => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' km' : Math.round(m) + ' m';
function haversine(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// ---------------------------------------------------------------------------
// Geography: Web Mercator <-> local metres (x = east, z = south, y = up)
// ---------------------------------------------------------------------------
const mercX = (lon) => (lon + 180) / 360;
const mercY = (lat) => { const s = Math.sin(lat * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
const invMercLon = (mx) => mx * 360 - 180;
const invMercLat = (my) => Math.atan(Math.sinh(Math.PI * (1 - 2 * my))) * 180 / Math.PI;

let T;            // terrain metadata (from data/terrain.json)
let heights;      // Float32Array of metres, row-major, north row first
let MX0, MX1, MY0, MY1;

function toLocal(lat, lon) {
  return {
    x: (mercX(lon) - MX0) / (MX1 - MX0) * T.sizeX - T.sizeX / 2,
    z: (mercY(lat) - MY0) / (MY1 - MY0) * T.sizeZ - T.sizeZ / 2,
  };
}
function toLatLon(x, z) {
  return {
    lon: invMercLon(MX0 + (x + T.sizeX / 2) / T.sizeX * (MX1 - MX0)),
    lat: invMercLat(MY0 + (z + T.sizeZ / 2) / T.sizeZ * (MY1 - MY0)),
  };
}
const inBounds = (lat, lon) => lat >= T.south && lat <= T.north && lon >= T.west && lon <= T.east;

// Bilinear elevation lookup (metres, not exaggerated) at local x/z.
function heightAt(x, z) {
  const W = T.width, H = T.height;
  const c = Math.min(Math.max((x + T.sizeX / 2) / T.sizeX * (W - 1), 0), W - 1.001);
  const r = Math.min(Math.max((z + T.sizeZ / 2) / T.sizeZ * (H - 1), 0), H - 1.001);
  const c0 = Math.floor(c), r0 = Math.floor(r), fc = c - c0, fr = r - r0;
  const i = r0 * W + c0;
  return heights[i] * (1 - fc) * (1 - fr) + heights[i + 1] * fc * (1 - fr)
       + heights[i + W] * (1 - fc) * fr + heights[i + W + 1] * fc * fr;
}

// ---------------------------------------------------------------------------
// three.js scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc9e0);
scene.fog = new THREE.Fog(0x9fc9e0, 15000, 45000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 5, 80000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 80;
controls.maxDistance = 30000;
controls.zoomToCursor = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.6));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(-6000, 9000, -4000);   // morning sun from the north-west-ish (southern hemisphere)
scene.add(sun);

// Everything that follows terrain height lives in `world`, whose y-scale is
// the vertical exaggeration. Screen-sized markers live outside it.
const world = new THREE.Group();
scene.add(world);

let waterMesh, topoTexture, baseTexture;   // baseTexture: whole-area satellite (coarse)
const lineMaterials = [];

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  for (const m of lineMaterials) m.resolution.set(innerWidth, innerHeight);
});

function disposeLine(l) {
  world.remove(l); l.geometry.dispose(); l.material.dispose();
  const i = lineMaterials.indexOf(l.material); if (i >= 0) lineMaterials.splice(i, 1);
}

function makeLineMaterial(color, width, opts = {}) {
  const m = new LineMaterial({ color, linewidth: width, worldUnits: false, ...opts });
  m.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(m);
  return m;
}

// ---------------------------------------------------------------------------
// Terrain: the heightmap is split into ~1 km chunks. Every chunk shows the
// coarse whole-area imagery until a sharp tile mosaic for that chunk has been
// streamed in (only for chunks near the camera, see updateDetail()).
// ---------------------------------------------------------------------------
const CHUNK_VERTS = 40;           // vertices per chunk edge (~1 km at 26 m spacing)
const chunks = [];                // { mesh, i, j, x0, x1, z0, z1, u0, u1, v0, v1, detail:{key,tex} }

async function loadTerrain() {
  T = await (await fetch(`${REGION.data}/terrain.json`)).json();
  MX0 = mercX(T.west); MX1 = mercX(T.east); MY0 = mercY(T.north); MY1 = mercY(T.south);
  const raw = new Int16Array(await (await fetch(`${REGION.data}/terrain.bin`)).arrayBuffer());
  heights = new Float32Array(raw.length);
  for (let i = 0; i < raw.length; i++) heights[i] = raw[i] / 10;

  topoTexture = makeTopoTexture();
  const W = T.width, H = T.height;
  const cellX = T.sizeX / (W - 1), cellZ = T.sizeZ / (H - 1);
  for (let r0 = 0; r0 < H - 1; r0 += CHUNK_VERTS - 1) {
    for (let c0 = 0; c0 < W - 1; c0 += CHUNK_VERTS - 1) {
      const c1 = Math.min(c0 + CHUNK_VERTS - 1, W - 1), r1 = Math.min(r0 + CHUNK_VERTS - 1, H - 1);
      const nc = c1 - c0 + 1, nr = r1 - r0 + 1;
      const pos = new Float32Array(nc * nr * 3), uv = new Float32Array(nc * nr * 2);
      let k = 0;
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        pos[k * 3] = c * cellX - T.sizeX / 2; pos[k * 3 + 1] = heights[r * W + c]; pos[k * 3 + 2] = r * cellZ - T.sizeZ / 2;
        uv[k * 2] = c / (W - 1); uv[k * 2 + 1] = 1 - r / (H - 1);   // whole-area UV
        k++;
      }
      const idx = [];
      for (let r = 0; r < nr - 1; r++) for (let c = 0; c < nc - 1; c++) {
        const a = r * nc + c, b = a + 1, d = a + nc, e = d + 1;
        idx.push(a, d, b, b, d, e);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: topoTexture, roughness: 1, metalness: 0 }));
      world.add(mesh);
      chunks.push({ mesh, x0: c0 * cellX - T.sizeX / 2, x1: c1 * cellX - T.sizeX / 2, z0: r0 * cellZ - T.sizeZ / 2, z1: r1 * cellZ - T.sizeZ / 2,
        u0: c0 / (W - 1), u1: c1 / (W - 1), v0: 1 - r1 / (H - 1), v1: 1 - r0 / (H - 1), detail: null, sea: true });
    }
  }
  // Chunks that are entirely sea never need sharp imagery.
  for (const ch of chunks) {
    for (let r = Math.round((ch.z0 + T.sizeZ / 2) / cellZ); r <= Math.round((ch.z1 + T.sizeZ / 2) / cellZ) && ch.sea; r++)
      for (let c = Math.round((ch.x0 + T.sizeX / 2) / cellX); c <= Math.round((ch.x1 + T.sizeX / 2) / cellX); c++)
        if (heights[r * W + c] >= 0) { ch.sea = false; break; }
  }
  // Normals along chunk seams are computed per chunk, which leaves faint lines; smooth them.
  stitchChunkNormals();

  waterMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(T.sizeX * 4, T.sizeZ * 4).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x1f6f8b, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.88 }));
  waterMesh.position.y = -0.3;
  waterMesh.visible = REGION.coast;   // inland areas (São Paulo sits at ~750 m) have no sea
  world.add(waterMesh);
}

function stitchChunkNormals() {
  // Recompute every vertex normal from the global heightmap so seams match exactly.
  const W = T.width, H = T.height, cellX = T.sizeX / (W - 1), cellZ = T.sizeZ / (H - 1);
  for (const ch of chunks) {
    const pos = ch.mesh.geometry.attributes.position, nor = ch.mesh.geometry.attributes.normal;
    for (let i = 0; i < pos.count; i++) {
      const c = Math.round((pos.getX(i) + T.sizeX / 2) / cellX), r = Math.round((pos.getZ(i) + T.sizeZ / 2) / cellZ);
      const hl = heights[r * W + Math.max(c - 1, 0)], hr = heights[r * W + Math.min(c + 1, W - 1)];
      const hu = heights[Math.max(r - 1, 0) * W + c], hd = heights[Math.min(r + 1, H - 1) * W + c];
      const n = new THREE.Vector3(-(hr - hl) / (2 * cellX), 1, -(hd - hu) / (2 * cellZ)).normalize();
      nor.setXYZ(i, n.x, n.y, n.z);
    }
    nor.needsUpdate = true;
  }
}

// Hypsometric tint + hillshade + contour lines, drawn into a canvas.
function makeTopoTexture() {
  const S = 2, W = T.width * S, H = T.height * S;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const cellX = T.sizeX / (T.width - 1), cellZ = T.sizeZ / (T.height - 1);
  const hs = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    hs[y * W + x] = heightAt((x / (W - 1) - 0.5) * T.sizeX, (y / (H - 1) - 0.5) * T.sizeZ);
  }
  // Hypsometric tint relative to sea level on the coast, or to the lowest point inland.
  const base = REGION.coast ? 0 : Math.floor(T.minElevation / 10) * 10;
  const ramp = [[0, [196, 214, 160]], [20, [150, 190, 120]], [60, [104, 160, 92]], [120, [150, 150, 96]], [200, [190, 160, 120]], [300, [235, 225, 210]]];
  const tint = (h0) => {
    const h = h0 - base;
    for (let i = 1; i < ramp.length; i++) if (h <= ramp[i][0]) {
      const [h0, c0] = ramp[i - 1], [h1, c1] = ramp[i], t = (h - h0) / (h1 - h0);
      return c0.map((v, k) => v + (c1[k] - v) * t);
    }
    return ramp[ramp.length - 1][1];
  };
  const lx = -0.6, ly = 0.6, lz = -0.5; // light direction for hillshade
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, h = hs[i], o = i * 4;
    if (REGION.coast && h < 0) { img.data[o] = 31; img.data[o + 1] = 111; img.data[o + 2] = 139; img.data[o + 3] = 255; continue; }
    const hl = hs[y * W + Math.max(x - 1, 0)], hr = hs[y * W + Math.min(x + 1, W - 1)];
    const hu = hs[Math.max(y - 1, 0) * W + x], hd = hs[Math.min(y + 1, H - 1) * W + x];
    const dx = (hr - hl) / (2 * cellX / S) * 2, dz = (hd - hu) / (2 * cellZ / S) * 2;
    const len = Math.hypot(dx, 1, dz);
    const shade = Math.max(0.35, (-dx * lx + ly - dz * lz) / len / Math.hypot(lx, ly, lz)) * 1.15;
    const c = tint(h);
    // Contours every 10 m, bolder every 50 m.
    let k = 1;
    if (x < W - 1 && y < H - 1) {
      const a = Math.floor(h / 10), b = Math.floor(hr / 10), d = Math.floor(hd / 10);
      if (a !== b || a !== d) k = (Math.max(a, b, d) % 5 === 0) ? 0.55 : 0.78;
    }
    img.data[o] = Math.min(255, c[0] * shade * k);
    img.data[o + 1] = Math.min(255, c[1] * shade * k);
    img.data[o + 2] = Math.min(255, c[2] * shade * k);
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// ---------------------------------------------------------------------------
// Imagery sources. Esri World Imagery is free and needs no key. Google
// satellite tiles (Map Tiles API) are optional: they need the Google key with
// "Map Tiles API" enabled, and are usually newer and sharper in Brazil.
// ---------------------------------------------------------------------------
const imagery = { source: 'esri', googleSession: null, maxZoom: 18 };

async function initImagery() {
  imagery.source = 'esri';
  if (settings.imagery === 'google' && googleKey()) {
    try {
      const res = await fetch(`https://tile.googleapis.com/v1/createSession?key=${encodeURIComponent(googleKey())}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mapType: 'satellite', language: 'en-US', region: 'BR' }),
      });
      const j = await res.json();
      if (!res.ok || !j.session) throw new Error(j.error?.message || `HTTP ${res.status}`);
      imagery.googleSession = j.session; imagery.source = 'google'; imagery.maxZoom = 19;
    } catch (e) {
      console.warn('Google tiles unavailable', e);
      toast('Google imagery unavailable (' + e.message + '). Using Esri imagery. Enable "Map Tiles API" for your key to use Google.', 8000);
      settings.imagery = 'esri'; saveSettings();
    }
  }
  $('attrib').textContent = (imagery.source === 'google' ? 'Imagery © Google' : 'Imagery © Esri') + ' · Trails © OpenStreetMap contributors · Terrain SRTM';
}

function tileUrl(z, x, y) {
  if (imagery.source === 'google') return `https://tile.googleapis.com/v1/2dtiles/${z}/${x}/${y}?session=${imagery.googleSession}&key=${encodeURIComponent(googleKey())}`;
  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
}

// Global tile download queue with limited concurrency (mobile networks).
const tileQueue = []; let tileActive = 0;
function fetchTile(z, x, y) {
  return new Promise((resolve) => {
    tileQueue.push({ z, x, y, resolve });
    pumpTiles();
  });
}
function pumpTiles() {
  while (tileActive < 6 && tileQueue.length) {
    const job = tileQueue.shift(); tileActive++;
    const im = new Image(); im.crossOrigin = 'anonymous';
    const done = (ok) => { tileActive--; job.resolve(ok ? im : null); pumpTiles(); };
    im.onload = () => done(true); im.onerror = () => done(false);
    im.src = tileUrl(job.z, job.x, job.y);
  }
}

// Mosaic of tiles covering a mercator rectangle [mx0,mx1]×[my0,my1] at zoom z.
async function mosaic(mx0, mx1, my0, my1, z, onProgress) {
  const n = 2 ** z;
  const px0 = mx0 * n * 256, px1 = mx1 * n * 256, py0 = my0 * n * 256, py1 = my1 * n * 256;
  const W = Math.max(1, Math.round(px1 - px0)), H = Math.max(1, Math.round(py1 - py0));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#1f4f5f'; ctx.fillRect(0, 0, W, H);
  const jobs = [];
  for (let ty = Math.floor(py0 / 256); ty < py1 / 256; ty++)
    for (let tx = Math.floor(px0 / 256); tx < px1 / 256; tx++) jobs.push([tx, ty]);
  let done = 0, failed = 0;
  await Promise.all(jobs.map(async ([tx, ty]) => {
    const im = await fetchTile(z, tx, ty);
    if (im) ctx.drawImage(im, tx * 256 - px0, ty * 256 - py0); else failed++;
    onProgress?.(++done / jobs.length);
  }));
  if (failed > jobs.length * 0.5) throw new Error('imagery unavailable');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.generateMipmaps = true;
  return tex;
}

// Coarse whole-area imagery (one texture, ~5 m/px).
async function loadBaseImagery(onProgress) {
  const z = renderer.capabilities.maxTextureSize >= 4096 ? 15 : 14;
  return mosaic(MX0, MX1, MY0, MY1, z, onProgress);
}

function chunkMerc(ch) {
  const fx = (x) => MX0 + (x + T.sizeX / 2) / T.sizeX * (MX1 - MX0);
  const fz = (z) => MY0 + (z + T.sizeZ / 2) / T.sizeZ * (MY1 - MY0);
  return { mx0: fx(ch.x0), mx1: fx(ch.x1), my0: fz(ch.z0), my1: fz(ch.z1) };
}

// Sharp imagery streaming: pick chunks near the camera target, load a zoom
// 17/18 mosaic for each (cropped to the chunk), and keep a bounded cache.
const detailCache = new Map();   // key -> { tex, used }
const detailLoading = new Set();
const DETAIL_LIMIT = { 18: 12, 17: 16 };
let lastDetailCheck = 0;

function detailZoomFor(camDist) {
  if (settings.layer !== 'satellite' || !settings.hires) return null;
  if (camDist < 1800) return Math.min(18, imagery.maxZoom);
  if (camDist < 5000) return 17;
  return null;
}

function updateDetail() {
  const now = performance.now();
  if (now - lastDetailCheck < 400 || !baseTexture) return;
  lastDetailCheck = now;
  const camDist = camera.position.distanceTo(controls.target);
  const z = detailZoomFor(camDist);
  const tx = controls.target.x, tz = controls.target.z;
  const radius = z === 18 ? 1500 : 3500;
  const wanted = [];
  for (const ch of chunks) {
    if (ch.sea) continue;
    const cx = (ch.x0 + ch.x1) / 2, cz = (ch.z0 + ch.z1) / 2;
    const d = Math.hypot(cx - tx, cz - tz);
    if (z && d < radius) wanted.push([d, ch]);
  }
  wanted.sort((a, b) => a[0] - b[0]);
  const keep = new Set();
  for (const [, ch] of wanted.slice(0, z ? DETAIL_LIMIT[z] : 0)) {
    // If the source has no tiles at this zoom for this chunk, settle for the next coarser one.
    const mk = (zz) => `${ch.x0}|${ch.z0}|${zz}|${imagery.source}`;
    let zz = z, key = mk(zz);
    while (detailCache.get(key)?.failed && zz > 17) { zz--; key = mk(zz); }
    if (detailCache.get(key)?.failed) continue;
    keep.add(key);
    const hit = detailCache.get(key);
    if (hit) { hit.used = now; applyChunkTexture(ch, hit.tex, key); continue; }
    if (detailLoading.has(key) || detailLoading.size >= 4) continue;
    detailLoading.add(key);
    const m = chunkMerc(ch);
    mosaic(m.mx0, m.mx1, m.my0, m.my1, zz).then((tex) => {
      // The mosaic covers exactly the chunk; map the chunk's whole-area UVs onto it.
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.repeat.set(1 / (ch.u1 - ch.u0), 1 / (ch.v1 - ch.v0));
      tex.offset.set(-ch.u0 / (ch.u1 - ch.u0), -ch.v0 / (ch.v1 - ch.v0));
      detailCache.set(key, { tex, used: performance.now() });
      evictDetail();
    }).catch(() => { detailCache.set(key, { failed: true, used: performance.now() }); }).finally(() => detailLoading.delete(key));
  }
  // Chunks no longer wanted at this zoom fall back to a coarser cached level or the base.
  for (const ch of chunks) {
    if (ch.detail && !keep.has(ch.detail)) {
      const alt = [18, 17].map((zz) => `${ch.x0}|${ch.z0}|${zz}|${imagery.source}`).find((k) => keep.has(k) || detailCache.has(k));
      if (alt && detailCache.get(alt)?.tex) applyChunkTexture(ch, detailCache.get(alt).tex, alt);
      else applyChunkTexture(ch, baseTexture, null);
    }
  }
}

function applyChunkTexture(ch, tex, key) {
  if (ch.mesh.material.map === tex) return;
  ch.mesh.material.map = tex; ch.mesh.material.needsUpdate = true; ch.detail = key;
}

function evictDetail() {
  const limit = DETAIL_LIMIT[18] + DETAIL_LIMIT[17] + 8;
  if (detailCache.size <= limit) return;
  const inUse = new Set(chunks.map((c) => c.detail));
  const victims = [...detailCache.entries()].filter(([k, v]) => !inUse.has(k) && v.tex).sort((a, b) => a[1].used - b[1].used);
  for (const [k, v] of victims.slice(0, detailCache.size - limit)) { v.tex.dispose(); detailCache.delete(k); }
}

function clearDetail() {
  for (const ch of chunks) if (ch.detail) applyChunkTexture(ch, settings.layer === 'satellite' && baseTexture ? baseTexture : topoTexture, null);
  for (const v of detailCache.values()) v.tex?.dispose();
  detailCache.clear();
}

function applyLayer() {
  const sat = settings.layer === 'satellite' && baseTexture;
  for (const ch of chunks) {
    if (sat && ch.detail && detailCache.get(ch.detail)?.tex) continue;
    applyChunkTexture(ch, sat ? baseTexture : topoTexture, null);
  }
  waterMesh.visible = !sat;
  if (buildingsMesh) buildingsMesh.visible = settings.show.buildings;
}

function applyExaggeration() {
  world.scale.y = settings.exaggeration;
}

// ---------------------------------------------------------------------------
// Buildings: OpenStreetMap footprints extruded onto the terrain.
// ---------------------------------------------------------------------------
let buildingsMesh = null;

function buildBuildings(footprints) {
  if (buildingsMesh) { world.remove(buildingsMesh); buildingsMesh.geometry.dispose(); buildingsMesh = null; }
  const geos = [];
  for (const b of footprints) {
    const ring = b.geometry;
    if (!ring || ring.length < 4) continue;
    const pts = ring.map((p) => toLocal(p.lat, p.lon));
    let base = Infinity, top = -Infinity;
    for (const p of pts) { const h = heightAt(p.x, p.z); base = Math.min(base, h); top = Math.max(top, h); }
    if (base < 0) continue;
    const t = b.tags || {};
    let height = parseFloat(t.height) || (parseFloat(t['building:levels']) || 0) * 3.2
      || ({ church: 10, cathedral: 14, hotel: 9, apartments: 9, commercial: 5, industrial: 6, warehouse: 6 }[t.building] || 4);
    // Shape in XZ: three.js Shape is 2D (x, y); we map y → -z so winding stays sane after rotation.
    const shape = new THREE.Shape(pts.map((p) => new THREE.Vector2(p.x, -p.z)));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: height + (top - base), bevelEnabled: false, curveSegments: 1 });
    geo.rotateX(-Math.PI / 2);          // extrude along +Y
    geo.translate(0, base, 0);
    geos.push(geo);
  }
  if (!geos.length) return;
  const merged = mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  merged.computeVertexNormals();
  buildingsMesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: 0xf2e9dc, roughness: 0.9, metalness: 0, flatShading: true }));
  buildingsMesh.visible = settings.show.buildings;
  world.add(buildingsMesh);
}

// ---------------------------------------------------------------------------
// Trails from OpenStreetMap (Overpass API)
// ---------------------------------------------------------------------------
let trails = [];          // { id, name, cat, latlon:[{lat,lon}], pts:[Vector3 base], length }
let pois = [];            // { name, kind, lat, lon }
const trailLayers = {};   // cat -> LineSegments2

function classify(tags) {
  const h = tags.highway;
  if (h === 'path' || h === 'footway' || h === 'bridleway' || h === 'cycleway' || h === 'pedestrian') return 'path';
  if (h === 'track') return 'track';
  if (h === 'steps') return 'steps';
  if (h) return 'road';
  return null;
}

function overpassQuery() {
  const b = `${T.south},${T.west},${T.north},${T.east}`;
  // A dense city needs a leaner query than a beach town: no service roads,
  // sidewalks, crossings or building footprints (hundreds of thousands in São Paulo).
  const ways = REGION.roads === 'all'
    ? `way["highway"~"^(path|footway|track|bridleway|steps|cycleway|pedestrian)$"](${b});
  way["highway"~"^(primary|secondary|tertiary|unclassified|residential|living_street|service)$"](${b});`
    : `way["highway"~"^(trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|pedestrian|cycleway|steps|path|bridleway)$"]["area"!="yes"](${b});
  way["highway"="footway"]["footway"!~"^(sidewalk|crossing)$"](${b});`;
  return `[out:json][timeout:${REGION.overpassTimeout}][maxsize:536870912];
(
  ${ways}
  ${REGION.routes ? `relation["route"~"^(hiking|foot|walking)$"](${b});` : ''}
  ${REGION.buildings ? `way["building"](${b});` : ''}
);
out geom;
(
  nwr["natural"="beach"]["name"](${b});
  nwr["place"~"^(town|village|hamlet|suburb|neighbourhood|quarter)$"]["name"](${b});
  nwr["natural"~"^(peak|bay|cape)$"]["name"](${b});
  nwr["waterway"="waterfall"](${b});
  node["tourism"="viewpoint"](${b});
  nwr["tourism"~"^(attraction|museum${REGION.roads === 'all' ? '|artwork|picnic_site' : ''})$"]["name"](${b});
  nwr["amenity"="marketplace"]["name"](${b});
  nwr["leisure"="park"]["name"](${b});
  nwr["sport"="surfing"]["name"](${b});
  nwr["amenity"~"^(restaurant|fast_food|bar|pub|biergarten|cafe|ice_cream)$"](${b});
);
out center;`;
}

async function fetchOSM() {
  const q = encodeURIComponent(overpassQuery());
  let lastErr;
  for (const ep of OVERPASS) {
    try {
      const res = await fetch(ep, { method: 'POST', body: 'data=' + q,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (!res.ok) throw new Error(`${res.status}`);
      return await res.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

// Trail data is cached with the Cache API (it can be several MB — too big for localStorage).
const OSM_CACHE = REGION.osmCache, OSM_KEY = 'osm-data.json';
async function cachedOSM() {
  try { const r = await (await caches.open(OSM_CACHE)).match(OSM_KEY); return r ? await r.json() : null; } catch { return null; }
}
async function saveOSM(osm) {
  try { await (await caches.open(OSM_CACHE)).put(OSM_KEY, new Response(JSON.stringify(osm), { headers: { 'Content-Type': 'application/json' } })); } catch {}
}

function densify(latlon) {
  // Convert to local points and insert extra samples so the line hugs the terrain.
  const out = [];
  for (let i = 0; i < latlon.length; i++) {
    const p = toLocal(latlon[i].lat, latlon[i].lon);
    if (i > 0) {
      const q = out[out.length - 1];
      const d = Math.hypot(p.x - q.x, p.z - q.z), steps = Math.floor(d / 12);
      for (let s = 1; s < steps; s++) {
        const t = s / steps, x = q.x + (p.x - q.x) * t, z = q.z + (p.z - q.z) * t;
        out.push(new THREE.Vector3(x, heightAt(x, z) + TRAIL_LIFT, z));
      }
    }
    out.push(new THREE.Vector3(p.x, heightAt(p.x, p.z) + TRAIL_LIFT, p.z));
  }
  return out;
}

function buildTrails(osm) {
  trails = []; pois = []; venues = [];
  const buildings = [];
  const routeWays = new Set();
  for (const el of osm.elements) {
    if (el.type === 'relation' && el.members) {
      const name = el.tags?.name || 'Hiking route';
      for (const m of el.members) {
        if (m.type !== 'way' || !m.geometry || m.geometry.length < 2) continue;
        routeWays.add(m.ref);
        trails.push({ id: `r${el.id}-${m.ref}`, rel: el.id, name, cat: 'route', latlon: m.geometry, tags: el.tags || {} });
      }
    }
  }
  for (const el of osm.elements) {
    if (el.type === 'way' && el.geometry && el.tags?.building) buildings.push(el);
    if (el.type === 'way' && el.geometry && el.tags?.highway) {
      if (routeWays.has(el.id)) {
        // Route relations carry the relation's tags; keep the way's own tags for access checks.
        for (const t of trails) if (t.rel && t.id.endsWith('-' + el.id)) t.wayTags = el.tags;
        continue;
      }
      const cat = classify(el.tags);
      if (!cat) continue;
      const fallback = { path: 'Unnamed trail', track: 'Unnamed track', steps: 'Steps', road: 'Unnamed road' }[cat];
      trails.push({ id: `w${el.id}`, name: el.tags.name || fallback, cat, latlon: el.geometry, tags: el.tags });
    } else if (AMENITY[el.tags?.amenity]) {
      const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
      if (lat == null || !inBounds(lat, lon)) continue;
      const a = AMENITY[el.tags.amenity];
      venues.push({ id: `${el.type[0]}${el.id}`, name: el.tags.name || VENUE_GROUPS[a.group].unnamed, group: a.group, icon: a.icon,
        kind: a.label, lat, lon, tags: el.tags });
    } else if (el.tags && placeKind(el.tags)) {
      const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
      if (lat == null || !inBounds(lat, lon)) continue;
      const t = el.tags, kind = placeKind(t);
      const name = t.name || PLACE_KINDS[kind].label;
      pois.push({ id: `${el.type[0]}${el.id}`, name, kind, group: PLACE_KINDS[kind].group, lat, lon,
        rank: kind === 'town' ? 0 : kind === 'beach' || kind === 'village' ? 1 : 2 });
    }
  }
  // Beaches are often mapped several times (polygon + node); keep one per name and kind.
  const seen = new Set();
  pois = pois.filter((p) => { const k = p.kind + '|' + p.name; if (seen.has(k)) return false; seen.add(k); return true; });
  mergeCurated();
  for (const t of trails) {
    t.pts = densify(t.latlon);
    t.length = 0;
    for (let i = 1; i < t.latlon.length; i++) t.length += haversine(t.latlon[i - 1], t.latlon[i]);
  }

  // One merged LineSegments2 per category keeps draw calls low.
  for (const cat of Object.keys(CATEGORIES)) {
    if (trailLayers[cat]) { disposeLine(trailLayers[cat]); delete trailLayers[cat]; }
    const segs = [];
    for (const t of trails) if (t.cat === cat)
      for (let i = 1; i < t.pts.length; i++) {
        const a = t.pts[i - 1], b = t.pts[i];
        segs.push(a.x, a.y, a.z, b.x, b.y, b.z);
      }
    if (!segs.length) continue;
    const g = new LineSegmentsGeometry().setPositions(segs);
    const line = new LineSegments2(g, makeLineMaterial(CATEGORIES[cat].color, CATEGORIES[cat].width));
    line.renderOrder = cat === 'road' ? 1 : 2;
    world.add(line);
    trailLayers[cat] = line;
  }
  buildGraph();
  buildBuildings(buildings);
  buildLabels();
  applyRatings();
  applyVisibility();
  if (nav.dest && gps.fix) computeRoute(false);
}

// Curated "top picks" for the area (data/<area>/places.json): markets, restaurants,
// bars, cafés and sights with a note on what to eat or why to go. Each one is
// attached to the matching OpenStreetMap venue or place, or added as its own marker.
let curated = [];
function mergeCurated() {
  for (const c of curated) {
    if (!inBounds(c.lat, c.lon)) continue;
    if (VENUE_GROUPS[c.group]) {
      let match = null, best = 250;
      for (const v of venues) { if (v.source || !sameName(v.name, c.name)) continue; const d = haversine(v, c); if (d < best) { best = d; match = v; } }
      if (match) match.pick = c;
      else venues.push({ id: 'c' + c.id, name: c.name, group: c.group, icon: { bar: '🍹', cafe: '☕' }[c.group] || '🍽️', kind: c.kind,
        lat: c.lat, lon: c.lon, tags: c.hours ? { opening_hours: c.hours } : {}, source: 'curated', pick: c });
    } else {
      const kind = c.group === 'market' ? 'market' : 'attraction';
      let match = null, best = 300;
      for (const p of pois) { if (!sameName(p.name, c.name)) continue; const d = haversine(p, c); if (d < best) { best = d; match = p; } }
      if (match) { match.pick = c; match.rank = Math.min(match.rank, 1); }
      else pois.push({ id: 'c' + c.id, name: c.name, kind, group: PLACE_KINDS[kind].group, lat: c.lat, lon: c.lon, rank: 1, pick: c });
    }
  }
}

function applyVisibility() {
  for (const [cat, l] of Object.entries(trailLayers)) l.visible = settings.show[cat];
  $('labels').style.display = settings.show.labels ? '' : 'none';
  for (const V of venueEls) V.hidden = !venueVisible(V.v);
}

// ---------------------------------------------------------------------------
// Labels (HTML elements positioned over the canvas each frame)
// ---------------------------------------------------------------------------
let labelEls = [];
function buildLabels() {
  const root = $('labels'); root.innerHTML = ''; labelEls = [];
  pois.sort((a, b) => a.rank - b.rank);
  for (const p of pois) {
    const el = document.createElement('div');
    el.className = 'label ' + (p.kind === 'beach' ? 'beach' : p.group === 'town' ? 'place' : p.group === 'market' ? 'market' : 'poi') + (p.pick ? ' pick' : '');
    el.textContent = p.name;
    el.addEventListener('click', (e) => { e.stopPropagation(); selectPlace(p); });
    root.appendChild(el);
    const l = toLocal(p.lat, p.lon);
    labelEls.push({ el, p, pos: new THREE.Vector3(l.x, heightAt(l.x, l.z), l.z), rank: p.rank });
  }
}
const tmpV = new THREE.Vector3();
function updateLabels() {
  if (!settings.show.labels) return;
  const placed = [];
  const camDist = camera.position.distanceTo(controls.target);
  for (const L of labelEls) {
    tmpV.copy(L.pos); tmpV.y *= settings.exaggeration; tmpV.y += 5;
    const d = tmpV.distanceTo(camera.position);
    tmpV.project(camera);
    const visible = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1
      && d < (L.rank === 0 ? 40000 : L.rank === 1 ? Math.max(6000, camDist * 2.2) : Math.max(2500, camDist * 1.2));
    if (!visible) { L.el.style.display = 'none'; continue; }
    const sx = (tmpV.x + 1) / 2 * innerWidth, sy = (1 - tmpV.y) / 2 * innerHeight;
    // Simple collision avoidance: skip labels that would overlap one already placed.
    if (placed.some(([px, py]) => Math.abs(px - sx) < 70 && Math.abs(py - sy) < 18)) { L.el.style.display = 'none'; continue; }
    placed.push([sx, sy]);
    L.el.style.display = '';
    L.el.style.left = sx + 'px'; L.el.style.top = sy + 'px';
  }
}

// Food & drink: restaurants, bars and cafés from OpenStreetMap, with optional

  restaurant: { label: 'Restaurants', color: '#ff7a59', unnamed: 'Restaurant' },
  bar:        { label: 'Bars', color: '#b47bff', unnamed: 'Bar' },
  cafe:       { label: 'Cafés', color: '#c8915a', unnamed: 'Café' },
};
const AMENITY = {
  restaurant: { group: 'restaurant', icon: '🍽️', label: 'Restaurant' },
  fast_food:  { group: 'restaurant', icon: '🍔', label: 'Fast food' },
  bar:        { group: 'bar', icon: '🍹', label: 'Bar' },
  pub:        { group: 'bar', icon: '🍺', label: 'Pub' },

let venues = [];     // { id, name, group, icon, kind, lat, lon, tags, rating?, ratingCount?, gUri?, price? }
let venueEls = [];
let googlePlaces = null;  // last Google Places result (cached)
let selectedVenue = null;

const venueVisible = (v) => settings.show[v.group]
  && (!settings.minRating || v.pick || (v.rating != null && v.rating >= settings.minRating));

function buildVenueMarkers() {
  const root = $('venues'); root.innerHTML = ''; venueEls = [];
  // Best-rated first so they win the collision culling when markers overlap.
  const sorted = venues.slice().sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0) || (b.ratingCount ?? 0) - (a.ratingCount ?? 0));
  for (const v of sorted) {
    const el = document.createElement('div');
    el.className = 'venue' + (v.pick ? ' pick' : '');
    el.style.setProperty('--c', VENUE_GROUPS[v.group].color);
    el.innerHTML = `<span class="ic">${v.icon}</span>${v.rating != null ? `<span class="rt" style="--rc:${reviewColor(v.ratingCount)}">${v.rating.toFixed(1)}</span>` : ''}<span class="nm"></span>`;
    el.querySelector('.nm').textContent = v.name;
    el.addEventListener('click', (e) => { e.stopPropagation(); selectVenue(v); });
    root.appendChild(el);
    const l = toLocal(v.lat, v.lon);
    venueEls.push({ el, v, pos: new THREE.Vector3(l.x, heightAt(l.x, l.z), l.z), hidden: !venueVisible(v), shown: true });
  }
}

function updateVenues() {
  const placed = [];
  const camDist = camera.position.distanceTo(controls.target);
  const showNames = camDist < 1500;
  for (const V of venueEls) {
    let ok = !V.hidden;
    let sx, sy;
    if (ok) {
      tmpV.copy(V.pos); tmpV.y *= settings.exaggeration;
      const d = tmpV.distanceTo(camera.position);
      tmpV.project(camera);
      ok = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1 && d < Math.max(2500, camDist * 1.6);
      sx = (tmpV.x + 1) / 2 * innerWidth; sy = (1 - tmpV.y) / 2 * innerHeight;
      const w = showNames ? 80 : 30;
      if (ok && V.v !== selectedVenue && placed.some(([px, py]) => Math.abs(px - sx) < w && Math.abs(py - sy) < 34)) ok = false;
    }
    if (!ok) { if (V.shown) { V.el.style.display = 'none'; V.shown = false; } continue; }
    placed.push([sx, sy]);
    if (!V.shown) { V.el.style.display = ''; V.shown = true; }
    V.el.style.left = sx + 'px'; V.el.style.top = sy + 'px';
    V.el.classList.toggle('sel', V.v === selectedVenue);
    V.el.lastChild.style.display = showNames || V.v === selectedVenue ? '' : 'none';
  }
}

const stars = (r) => '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
// Review-count confidence colour, relative to every other rated place on the map:
// the venue's percentile of review count maps onto a red → amber → green gradient,
// so the most-reviewed places here are green whatever the absolute numbers are.
let reviewCounts = [];   // sorted counts of all rated venues, rebuilt when ratings load
function updateReviewScale() {
  reviewCounts = venues.filter((v) => v.rating != null).map((v) => v.ratingCount ?? 0).sort((a, b) => a - b);
}
function reviewRank(n) {
  if (!reviewCounts.length) return 0.5;
  // Fraction of rated places with fewer (or equal) reviews, mid-ranked on ties.
  let lo = 0, hi = reviewCounts.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (reviewCounts[m] < n) lo = m + 1; else hi = m; }
  let lo2 = lo, hi2 = reviewCounts.length;
  while (lo2 < hi2) { const m = (lo2 + hi2) >> 1; if (reviewCounts[m] <= n) lo2 = m + 1; else hi2 = m; }
  return reviewCounts.length === 1 ? 1 : ((lo + lo2 - 1) / 2) / (reviewCounts.length - 1);
}
const lerpHex = (a, b, t) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(a.slice(1 + i, 3 + i), 16) * (1 - t)
  + parseInt(b.slice(1 + i, 3 + i), 16) * t).toString(16).padStart(2, '0')).join('');
function reviewColor(n) {
  const r = Math.max(0, Math.min(1, reviewRank(n ?? 0)));
  return r < 0.5 ? lerpHex('#ff5a5f', '#ffb547', r * 2) : lerpHex('#ffb547', '#3ddc84', (r - 0.5) * 2);
}
const ratingBadge = (v) => `<span class="rbadge" style="--rc:${reviewColor(v.ratingCount)}" title="${v.ratingCount ?? 0} Google reviews">${v.rating.toFixed(1)}</span>`;
// Google's own listing (business profile with reviews, photos, hours) in a new tab.
const googleListingUrl = (v) => `https://www.google.com/search?q=${encodeURIComponent(v.name + ' ' + REGION.searchSuffix)}`;

function selectVenue(v) {

  const website = t.website || t['contact:website'];

  const mapsUrl = v.gUri || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.name + ' ' + REGION.searchSuffix)}`;
  const ratingHtml = v.rating != null
    ? `<div class="row">${ratingBadge(v)}<span class="stars">${stars(v.rating)}</span><span class="small" style="color:${reviewColor(v.ratingCount)}">${v.ratingCount ?? 0} Google reviews</span>${v.price ? `<span class="small">· ${v.price}</span>` : ''}</div>`
    : `<div class="small" style="margin:6px 0">No rating yet${googleKey() ? '' : ' — add a Google API key in Layers to load ratings'}.</div>`;
  openSheet(`<h2>${v.icon} ${escapeHtml(v.name)}</h2>
    <div class="sub">${escapeHtml(v.kind)}${cuisine ? ' · ' + escapeHtml(cuisine) : ''}${v.openNow != null ? (v.openNow ? ' · <b style="color:#5be38a">Open now</b>' : ' · <b style="color:#ff8a8a">Closed now</b>') : ''}</div>
    ${ratingHtml}
    ${v.pick ? `<div class="notes">⭐ <b>Top pick</b> · ${escapeHtml(v.pick.area)}<br>${escapeHtml(v.pick.notes || '')}</div>` : ''}
    <div class="stats">
      ${gps.fix ? `<div class="stat"><b>${fmtKm(haversine(gps.fix, v))}</b><span>from you</span></div>` : ''}
      <div class="stat"><b>${fmtKm(haversine(TOWN, v))}</b><span>from ${REGION.centerName}</span></div>
      <div class="stat"><b>${Math.round(Math.max(heightAt(l.x, l.z), 0))} m</b><span>elevation</span></div>
    </div>
    ${t.opening_hours ? `<div class="small">Hours: ${escapeHtml(t.opening_hours)}</div>` : ''}
    ${routeButtons(v)}
    <div class="row">

      <a class="pill" target="_blank" rel="noopener" href="${escapeHtml(googleListingUrl(v))}">Google listing ↗</a>
      ${phone ? `<a class="pill" href="tel:${escapeHtml(phone.replace(/\s/g, ''))}">Call</a>` : ''}
      ${website ? `<a class="pill" target="_blank" rel="noopener" href="${escapeHtml(website)}">Website ↗</a>` : ''}
      ${insta ? `<a class="pill" target="_blank" rel="noopener" href="${escapeHtml(insta.startsWith('http') ? insta : 'https://instagram.com/' + insta.replace('@', ''))}">Instagram ↗</a>` : ''}
    </div>
    <div class="small">${v.source === 'google' ? 'Listing from Google Places.' : v.source === 'curated' ? 'Curated pick.' : 'Listing © OpenStreetMap contributors.'}${v.rating != null ? ' Rating from Google.' : ''}</div>`);
  bindRouteButtons(v);
  flyTo(l.x, l.z, Math.min(camera.position.distanceTo(controls.target), 900));
