// --- Google Places ratings -------------------------------------------------
const RATINGS_CACHE = REGION.ratingsCache, RATINGS_KEY = 'google-places.json';
const RATINGS_MAX_AGE = 7 * 24 * 3600 * 1000;  // refetch weekly at most

async function fetchGooglePlaces(key) {
  // Text Search returns at most 60 results per query (3 pages of 20), so the busy
  // districts are searched separately from the whole map area.
  const regions = [...REGION.ratingRects, { low: { latitude: T.south, longitude: T.west }, high: { latitude: T.north, longitude: T.east } }];
  const queries = [['restaurant', 'restaurants'], ['bar', 'bars'], ['cafe', 'cafes and coffee']];
  const found = new Map();
  for (const rect of regions) for (const [type, text] of queries) {
    let pageToken;
    for (let page = 0; page < 3; page++) {
      const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': key,
          'X-Goog-FieldMask': 'places.id,places.displayName,places.location,places.rating,places.userRatingCount,'
            + 'places.primaryType,places.types,places.googleMapsUri,places.priceLevel,places.currentOpeningHours.openNow,nextPageToken',
        },
        body: JSON.stringify({ textQuery: text, includedType: type, locationRestriction: { rectangle: rect }, pageSize: 20, pageToken }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
      for (const p of json.places || []) found.set(p.id, p);
      pageToken = json.nextPageToken;
      if (!pageToken) break;
    }
  }
  return [...found.values()];
}

const plainName = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const normName = (s) => plainName(s)
  .replace(/\b(restaurante|restaurant|bar|cafe|cafeteria|pizzaria|pousada|lanchonete|do|da|de|the|e)\b/g, '')
  .replace(/[^a-z0-9]/g, '');
// Same place? Compare names without filler words ("Restaurante", "Bar do"…);
// short leftovers like "ze" must match the full name exactly instead.
function sameName(a, b) {
  const x = normName(a), y = normName(b);
  if (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x))) return true;
  return plainName(a).replace(/[^a-z0-9]/g, '') === plainName(b).replace(/[^a-z0-9]/g, '');
}

function googleGroup(p) {
  const types = [p.primaryType, ...(p.types || [])];
  if (types.some((t) => ['bar', 'pub', 'night_club', 'wine_bar', 'cocktail_bar', 'bar_and_grill'].includes(t)) && !types.includes('restaurant')) return 'bar';
  if (types.some((t) => ['cafe', 'coffee_shop', 'ice_cream_shop', 'bakery', 'tea_house', 'acai_shop', 'juice_shop'].includes(t))
    && p.primaryType !== 'restaurant') return 'cafe';
  return 'restaurant';
}

// Attach Google ratings to OSM venues (matched by name within ~100 m) and add
// Google-only places as new markers.
function applyRatings() {
  if (googlePlaces) {
    venues = venues.filter((v) => v.source !== 'google');
    for (const v of venues) delete v.rating;
    for (const p of googlePlaces) {
      const lat = p.location?.latitude, lon = p.location?.longitude;
      if (lat == null || !inBounds(lat, lon)) continue;
      const name = p.displayName?.text || 'Unnamed';
      let match = null, best = 100;
      for (const v of venues) {
        if (v.rating != null || v.source === 'google' || !(v.tags?.name || v.source === 'curated') || !sameName(v.name, name)) continue;
        const d = haversine(v, { lat, lon });
        if (d < best) { best = d; match = v; }
      }
      const price = { PRICE_LEVEL_INEXPENSIVE: '$', PRICE_LEVEL_MODERATE: '$$', PRICE_LEVEL_EXPENSIVE: '$$$', PRICE_LEVEL_VERY_EXPENSIVE: '$$$$' }[p.priceLevel];
      const info = { rating: p.rating, ratingCount: p.userRatingCount, gUri: p.googleMapsUri, price, openNow: p.currentOpeningHours?.openNow };
      if (p.rating == null) delete info.rating;
      if (match) Object.assign(match, info);
      else {
        const group = googleGroup(p);
        const icon = group === 'bar' ? '🍹' : group === 'cafe' ? '☕' : '🍽️';
        venues.push({ id: 'g' + p.id, name, group, icon, kind: VENUE_GROUPS[group].unnamed, lat, lon, tags: {}, source: 'google', ...info });
      }
    }
  }
  updateReviewScale();
  buildVenueMarkers();
}

async function loadRatings(force = false) {
  const key = googleKey();
  if (!key) return;
  try {
    const cache = await caches.open(RATINGS_CACHE);
    const hit = force ? null : await cache.match(RATINGS_KEY);
    const cached = hit ? await hit.json() : null;
    if (cached && Date.now() - cached.t < RATINGS_MAX_AGE) googlePlaces = cached.places;
    else {
      if (force) toast('Loading ratings from Google…');
      googlePlaces = await fetchGooglePlaces(key);
      await cache.put(RATINGS_KEY, new Response(JSON.stringify({ t: Date.now(), places: googlePlaces })));
      toast(`Loaded ratings for ${googlePlaces.filter((p) => p.rating != null).length} places.`);
    }
    if (venues.length || googlePlaces.length) { applyRatings(); applyVisibility(); }
  } catch (e) {
    console.warn(e);
    toast('Could not load Google ratings: ' + e.message, 7000);
  }
}

// ---------------------------------------------------------------------------
// Places (beaches, viewpoints, waterfalls, sights, towns) — selectable like venues
// ---------------------------------------------------------------------------
const PLACE_KINDS = {
  beach:     { icon: '🏖️', label: 'Beach', group: 'beach' },
  town:      { icon: '🏘️', label: 'Town', group: 'town' },
  village:   { icon: '🏘️', label: 'Village', group: 'town' },
  hamlet:    { icon: '🏡', label: 'Hamlet', group: 'town' },
  suburb:    { icon: '🏘️', label: 'Neighbourhood', group: 'town' },
  waterfall: { icon: '💦', label: 'Waterfall', group: 'sight' },
  viewpoint: { icon: '🔭', label: 'Viewpoint', group: 'sight' },
  peak:      { icon: '⛰️', label: 'Peak', group: 'sight' },
  cape:      { icon: '🌊', label: 'Cape', group: 'sight' },
  bay:       { icon: '🌊', label: 'Bay', group: 'sight' },
  attraction:{ icon: '📍', label: 'Attraction', group: 'sight' },
  museum:    { icon: '🏛️', label: 'Museum', group: 'sight' },
  artwork:   { icon: '🎨', label: 'Artwork', group: 'sight' },
  picnic:    { icon: '🧺', label: 'Picnic site', group: 'sight' },
  surf:      { icon: '🏄', label: 'Surf spot', group: 'beach' },
  market:    { icon: '🧺', label: 'Market', group: 'market' },
  park:      { icon: '🌳', label: 'Park', group: 'sight' },
};
const PLACE_GROUPS = { market: 'Markets', beach: 'Beaches', sight: 'Sights', town: 'Towns' };

function placeKind(t) {
  if (t.natural === 'beach') return 'beach';
  if (t.amenity === 'marketplace') return 'market';
  if (t.leisure === 'park') return 'park';
  if (t.place === 'quarter') return 'suburb';
  if (t.place && PLACE_KINDS[t.place]) return t.place;
  if (t.place === 'neighbourhood') return 'suburb';
  if (t.waterway === 'waterfall') return 'waterfall';
  if (t.tourism === 'viewpoint') return 'viewpoint';
  if (t.natural && PLACE_KINDS[t.natural]) return t.natural;
  if (t.tourism === 'picnic_site') return 'picnic';
  if (t.tourism && PLACE_KINDS[t.tourism]) return t.tourism;
  if (t.sport === 'surfing') return 'surf';
  return null;
}

function selectPlace(p) {
  const l = toLocal(p.lat, p.lon);
  const k = PLACE_KINDS[p.kind];
  openSheet(`<h2>${k.icon} ${escapeHtml(p.name)}</h2><div class="sub">${p.pick ? escapeHtml(p.pick.kind) + ' · ' + escapeHtml(p.pick.area) : k.label}</div>
    ${p.pick ? `<div class="notes">⭐ <b>Top pick</b><br>${escapeHtml(p.pick.notes || '')}</div>${p.pick.hours ? `<div class="small">Hours: ${escapeHtml(p.pick.hours)}</div>` : ''}` : ''}
    <div class="stats">
      ${gps.fix ? `<div class="stat"><b>${fmtKm(haversine(gps.fix, p))}</b><span>from you</span></div>` : ''}
      <div class="stat"><b>${fmtKm(haversine(TOWN, p))}</b><span>from ${REGION.centerName}</span></div>
      <div class="stat"><b>${Math.round(Math.max(heightAt(l.x, l.z), 0))} m</b><span>elevation</span></div>
    </div>
    ${routeButtons(p)}
    <div class="small">${p.pick && String(p.id).startsWith('c') ? 'Curated pick.' : '© OpenStreetMap contributors.'}</div>`);
  bindRouteButtons(p);
  flyTo(l.x, l.z, Math.min(camera.position.distanceTo(controls.target), 1500));
}

// Shared "Route here" + Google directions buttons for any sheet.
function routeButtons(dest) {
  return `<div class="row">
    <button class="pill go" id="routeHere">🧭 Route here</button>
    <a class="pill" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lon}&travelmode=${settings.routeMode === 'moped' ? 'driving' : 'walking'}">Google directions ↗</a>
  </div>`;
}
function bindRouteButtons(dest) {
  $('routeHere')?.addEventListener('click', () => startNavigation(dest));
}

// ---------------------------------------------------------------------------
// Routing: shortest walking path over the OSM trail + road network, from the
// phone's live GPS position to a chosen destination. Pure client-side Dijkstra.
// ---------------------------------------------------------------------------
const graph = { nodes: [], adj: [], edges: [] };   // nodes: {lat,lon,x,z}; adj[i]: [[j, cost], ...]

// Which ways may a given travel mode use, and how "expensive" they feel.
// Returns a cost multiplier, or null when the way is not allowed in that mode.
const ROUTE_MODES = { moped: { icon: '🛵', label: 'Moped / e-bike', kmh: 15 }, walk: { icon: '🚶', label: 'Walk', kmh: 5 } };
function modeFactor(t, mode) {
  const g = t.wayTags || t.tags || {};
  const h = g.highway;
  const no = (v) => v === 'no' || v === 'private';
  const yes = (v) => v === 'yes' || v === 'designated' || v === 'permissive';
  if (mode === 'walk') {
    if (no(g.foot) || (no(g.access) && !yes(g.foot))) return null;
    if ((h === 'motorway' || h === 'motorway_link' || h === 'trunk' || h === 'trunk_link') && !yes(g.foot)) return null;
    return h === 'steps' ? 1.3 : 1;
  }
  // Moped / e-bike: legal for motor vehicles or bicycles, and physically rideable.
  const explicit = yes(g.moped) || yes(g.mofa) || yes(g.motor_vehicle);
  if (no(g.access) && !explicit && !yes(g.bicycle)) return null;
  if (no(g.motor_vehicle) && !yes(g.moped) && !yes(g.mofa) && !yes(g.bicycle)) return null;
  if (no(g.vehicle) || no(g.moped)) return null;
  if (!h && t.cat === 'route') return null;            // hiking route with no road data
  if (['steps', 'footway', 'pedestrian', 'corridor'].includes(h)) return null;
  if (h === 'path' || h === 'bridleway') return (explicit || yes(g.bicycle)) ? 1.8 : null;
  if (h === 'cycleway') return g.bicycle === 'no' ? null : 1.1;
  if (h === 'track') return g.tracktype === 'grade5' ? 2.2 : 1.4;
  if (h === 'motorway' || h === 'motorway_link' || h === 'trunk' || h === 'trunk_link') return null;
  return 1;
}

function buildGraph() {
  graph.nodes = []; graph.adj = []; graph.edges = [];
  const index = new Map();
  // OSM ways that join share identical coordinates, so a coordinate key is a node id.
  const nodeFor = (p) => {
    const key = p.lat.toFixed(6) + ',' + p.lon.toFixed(6);
    let i = index.get(key);
    if (i == null) {
      i = graph.nodes.length; index.set(key, i);
      const l = toLocal(p.lat, p.lon);
      graph.nodes.push({ lat: p.lat, lon: p.lon, x: l.x, z: l.z });
      graph.adj.push([]);
    }
    return i;
  };
  graph.mode = settings.routeMode;
  for (const t of trails) {
    const factor = modeFactor(t, settings.routeMode);
    if (factor == null) continue;
    for (let i = 1; i < t.latlon.length; i++) {
      const a = nodeFor(t.latlon[i - 1]), b = nodeFor(t.latlon[i]);
      if (a === b) continue;
      const len = haversine(t.latlon[i - 1], t.latlon[i]);
      graph.adj[a].push([b, len * factor]); graph.adj[b].push([a, len * factor]);
      graph.edges.push([a, b, len]);
    }
  }
}

// Closest point on any network edge to a lat/lon (brute force; ~30k edges is fine).
function snapToNetwork(lat, lon) {
  const p = toLocal(lat, lon);
  let best = null;
  for (const [a, b, len] of graph.edges) {
    const A = graph.nodes[a], B = graph.nodes[b];
    const dx = B.x - A.x, dz = B.z - A.z, l2 = dx * dx + dz * dz;
    let t = l2 ? ((p.x - A.x) * dx + (p.z - A.z) * dz) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const x = A.x + dx * t, z = A.z + dz * t;
    const d = Math.hypot(p.x - x, p.z - z);
    if (!best || d < best.d) best = { d, a, b, t, len, x, z };
  }
  return best;
}

// Small binary heap for Dijkstra.
class MinHeap {
  constructor() { this.a = []; }
  push(k, v) { const a = this.a; a.push([k, v]); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a, top = a[0], last = a.pop(); if (a.length) { a[0] = last; let i = 0;
      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } }
    return top; }
  get size() { return this.a.length; }
}

// Returns { points:[{lat,lon}], length } along the network, or null if unreachable.
function findRoute(from, to) {
  if (graph.mode !== settings.routeMode) buildGraph();
  if (!graph.edges.length) return null;
  const s = snapToNetwork(from.lat, from.lon), e = snapToNetwork(to.lat, to.lon);
  if (!s || !e) return null;
  const n = graph.nodes.length;
  const dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1);
  const heap = new MinHeap();
  // Virtual start: the snapped point reaches both ends of its edge.
  dist[s.a] = s.len * s.t; dist[s.b] = s.len * (1 - s.t);
  heap.push(dist[s.a], s.a); heap.push(dist[s.b], s.b);
  const goalCost = (i) => i === e.a ? e.len * e.t : i === e.b ? e.len * (1 - e.t) : Infinity;
  let bestEnd = -1, bestTotal = Infinity;
  // Same edge, start and end between the same two nodes: direct.
  if (s.a === e.a && s.b === e.b) { bestTotal = Math.abs(s.t - e.t) * s.len; }
  while (heap.size) {
    const [d, i] = heap.pop();
    if (d > dist[i]) continue;
    if (d >= bestTotal) break;
    const g = goalCost(i);
    if (d + g < bestTotal) { bestTotal = d + g; bestEnd = i; }
    for (const [j, w] of graph.adj[i]) {
      const nd = d + w;
      if (nd < dist[j]) { dist[j] = nd; prev[j] = i; heap.push(nd, j); }
    }
  }
  if (!Number.isFinite(bestTotal)) return null;
  const pts = [];
  if (bestEnd >= 0) {
    for (let i = bestEnd; i >= 0; i = prev[i]) {
      pts.push({ lat: graph.nodes[i].lat, lon: graph.nodes[i].lon });
      if (i === s.a || i === s.b) break;
    }
    pts.reverse();
  }
  const sLL = toLatLon(s.x, s.z), eLL = toLatLon(e.x, e.z);
  pts.unshift({ lat: sLL.lat, lon: sLL.lon });
  pts.push({ lat: eLL.lat, lon: eLL.lon });
  let length = 0;
  for (let i = 1; i < pts.length; i++) length += haversine(pts[i - 1], pts[i]);
  return { points: pts, length, startGap: s.d, endGap: e.d };
}

const nav = { dest: null, route: null, line: null, link: null, lastCalc: 0, pending: false };

function startNavigation(dest) {
  nav.dest = { name: dest.name || 'Destination', lat: dest.lat, lon: dest.lon };
  closeSheet();
  if (!gps.fix || !inBounds(gps.fix.lat, gps.fix.lon)) {
    nav.pending = true;
    startGps();
    gps.follow = true; $('btnGps').classList.add('on');
    showNav('Finding your location…');
    if (gps.fix) toast('You are outside the map area; the route will appear once you are in range.', 5000);
    return;
  }
  gps.follow = true; $('btnGps').classList.add('on');
  computeRoute(true);
}

function computeRoute(fit = false) {
  if (!nav.dest || !gps.fix) return;
  nav.lastCalc = performance.now();
  nav.pending = false;
  const r = findRoute(gps.fix, nav.dest);
  if (!r) {
    // No connected path in the data: show a straight line so the user still has a bearing.
    nav.route = { points: [{ lat: gps.fix.lat, lon: gps.fix.lon }, { lat: nav.dest.lat, lon: nav.dest.lon }],
      length: haversine(gps.fix, nav.dest), straight: true, startGap: 0, endGap: 0 };
  } else nav.route = r;
  drawRoute();
  updateNavBanner();
  if (fit) fitRoute();
}

function drawRoute() {
  if (nav.line) { disposeLine(nav.line); nav.line = null; }
  if (nav.link) { disposeLine(nav.link); nav.link = null; }
  if (!nav.route) return;
  const pts = densify(nav.route.points);
  const arr = []; for (const p of pts) arr.push(p.x, p.y + 1.5, p.z);
  nav.line = new Line2(new LineGeometry().setPositions(arr),
    makeLineMaterial(nav.route.straight ? 0xffffff : 0x00ff88, 7, nav.route.straight ? { dashed: true, dashSize: 30, gapSize: 20 } : {}));
  if (nav.route.straight) nav.line.computeLineDistances();
  nav.line.renderOrder = 6;
  world.add(nav.line);
  // Dotted connectors from the exact position / destination to the nearest point of the network.
  if (!nav.route.straight && (nav.route.startGap > 8 || nav.route.endGap > 8)) {
    const seg = [];
    const push = (a, b) => { const A = toLocal(a.lat, a.lon), B = toLocal(b.lat, b.lon);
      seg.push(A.x, heightAt(A.x, A.z) + TRAIL_LIFT + 1.5, A.z, B.x, heightAt(B.x, B.z) + TRAIL_LIFT + 1.5, B.z); };
    if (nav.route.startGap > 8) push(gps.fix, nav.route.points[0]);
    if (nav.route.endGap > 8) push(nav.route.points[nav.route.points.length - 1], nav.dest);
    nav.link = new LineSegments2(new LineSegmentsGeometry().setPositions(seg),
      makeLineMaterial(0xffffff, 3, { dashed: true, dashSize: 8, gapSize: 8 }));
    nav.link.computeLineDistances();
    nav.link.renderOrder = 6;
    world.add(nav.link);
  }
}

function fitRoute() {
  if (!nav.route) return;
  const a = toLocal(gps.fix.lat, gps.fix.lon), b = toLocal(nav.dest.lat, nav.dest.lon);
  const d = Math.hypot(a.x - b.x, a.z - b.z);
  flyTo((a.x + b.x) / 2, (a.z + b.z) / 2, Math.max(500, d * 1.6));
  gps.follow = false; $('btnGps').classList.remove('on');
}

// Remaining distance along the route from the user's current position.
function routeProgress() {
  const pts = nav.route.points;
  const p = toLocal(gps.fix.lat, gps.fix.lon);
  let best = { d: Infinity, i: 0, t: 0 };
  const loc = pts.map((q) => toLocal(q.lat, q.lon));
  for (let i = 1; i < loc.length; i++) {
    const A = loc[i - 1], B = loc[i], dx = B.x - A.x, dz = B.z - A.z, l2 = dx * dx + dz * dz;
    let t = l2 ? ((p.x - A.x) * dx + (p.z - A.z) * dz) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(p.x - (A.x + dx * t), p.z - (A.z + dz * t));
    if (d < best.d) best = { d, i, t };
  }
  let remaining = haversine(pts[best.i - 1], pts[best.i]) * (1 - best.t);
  for (let i = best.i + 1; i < pts.length; i++) remaining += haversine(pts[i - 1], pts[i]);
  // Ascent still to climb (from the terrain model).
  let up = 0, last = null;
  for (let i = best.i; i < pts.length; i++) {
    const l = toLocal(pts[i].lat, pts[i].lon), h = heightAt(l.x, l.z);
    if (last != null && h - last >= 3) up += h - last;
    if (last == null || Math.abs(h - last) >= 3) last = h;
  }
  return { offRoute: best.d, remaining, up };
}

function updateNavBanner() {
  if (!nav.dest || !nav.route || !gps.fix) return;
  const pr = routeProgress();
  const m = ROUTE_MODES[settings.routeMode];
  const mins = Math.round(pr.remaining / 1000 / m.kmh * 60 + (settings.routeMode === 'walk' ? pr.up / 10 : 0));
  const bearing = (() => {
    const toR = Math.PI / 180, a = gps.fix, b = nav.dest;
    const y = Math.sin((b.lon - a.lon) * toR) * Math.cos(b.lat * toR);
    const x = Math.cos(a.lat * toR) * Math.sin(b.lat * toR) - Math.sin(a.lat * toR) * Math.cos(b.lat * toR) * Math.cos((b.lon - a.lon) * toR);
    const deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8];
  })();
  showNav(`${m.icon} <b>${escapeHtml(nav.dest.name)}</b> · ${fmtKm(pr.remaining)} · ~${mins} min · ↑${Math.round(pr.up)} m · ${bearing}`
    + (nav.route.straight ? ` · <i>no ${settings.routeMode === 'moped' ? 'moped-suitable' : 'mapped'} path, straight line</i>` : pr.offRoute > 40 ? ' · <i>off route</i>' : ''));
}

function showNav(html) {
  const el = $('nav');
  el.querySelector('.txt').innerHTML = html;
  el.style.display = 'flex';
}

function stopNavigation() {
  nav.dest = null; nav.route = null; nav.pending = false; clearTimeout(nav.retry);
  if (nav.line) { disposeLine(nav.line); nav.line = null; }
  if (nav.link) { disposeLine(nav.link); nav.link = null; }
  $('nav').style.display = 'none';
}
$('navStop').addEventListener('click', stopNavigation);
$('navFit').addEventListener('click', () => { if (nav.route && gps.fix) fitRoute(); });
function setRouteMode(mode) {
  settings.routeMode = mode; saveSettings();
  $('navMode').textContent = ROUTE_MODES[mode].icon;
  $('navMode').title = `${ROUTE_MODES[mode].label} — tap to switch`;
  if (nav.dest && gps.fix) computeRoute(false);
  toast(`Routing for ${ROUTE_MODES[mode].label.toLowerCase()}.`);
}
$('navMode').addEventListener('click', () => setRouteMode(settings.routeMode === 'moped' ? 'walk' : 'moped'));
$('navMode').textContent = ROUTE_MODES[settings.routeMode].icon;

// Called from onPosition on every GPS fix.
function onNavPosition() {
  if (!nav.dest) return;
  if (nav.pending || !nav.route) { computeRoute(true); return; }
  if (haversine(gps.fix, nav.dest) < 25) {
    toast(`You have arrived at ${nav.dest.name}.`, 6000);
    stopNavigation();
    return;
  }
  const pr = routeProgress();
  // Re-route when the user has clearly left the path (and not more than every 10 s).
  if (pr.offRoute > 40) {
    const wait = 10000 - (performance.now() - nav.lastCalc);
    if (wait <= 0) { computeRoute(false); return; }
    clearTimeout(nav.retry);
    nav.retry = setTimeout(() => { if (nav.dest && nav.route && routeProgress().offRoute > 40) computeRoute(false); }, wait);
  }
  updateNavBanner();
}

// ---------------------------------------------------------------------------
// GPS location
// ---------------------------------------------------------------------------
const gps = { watchId: null, fix: null, follow: false, track: store.get('itacare.track', []), recording: false };

const meGroup = new THREE.Group(); meGroup.visible = false; scene.add(meGroup);
const meDot = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshBasicMaterial({ color: 0x2f8cff, depthTest: false }));
const meRing = new THREE.Mesh(new THREE.SphereGeometry(1.45, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
const meStem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 8), new THREE.MeshBasicMaterial({ color: 0x2f8cff }));
const meAcc = new THREE.Mesh(new THREE.CircleGeometry(1, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: 0.22, depthWrite: false }));
const meArrow = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 3).rotateX(-Math.PI / 2).translate(0, 0, -2.3),
  new THREE.MeshBasicMaterial({ color: 0x2f8cff, depthTest: false }));
meDot.renderOrder = 11; meRing.renderOrder = 10; meArrow.renderOrder = 11;
const meHead = new THREE.Group(); meHead.add(meRing, meDot, meArrow);
meGroup.add(meHead, meStem, meAcc);

let trackLine;
function drawTrack() {
  if (trackLine) { disposeLine(trackLine); trackLine = null; }
  const inside = gps.track.filter((p) => inBounds(p.lat, p.lon));
  if (inside.length < 2) return;
  const pts = [];
  for (const p of inside) { const l = toLocal(p.lat, p.lon); pts.push(l.x, heightAt(l.x, l.z) + TRAIL_LIFT + 1, l.z); }
  trackLine = new Line2(new LineGeometry().setPositions(pts), makeLineMaterial(0xe5484d, 4));
  trackLine.renderOrder = 4;
  world.add(trackLine);
}

function onPosition(pos) {
  const { latitude: lat, longitude: lon, accuracy, altitude, heading, speed } = pos.coords;
  const first = !gps.fix;
  gps.fix = { lat, lon, accuracy, altitude, heading, speed, t: pos.timestamp };
  if (!inBounds(lat, lon)) {
    meGroup.visible = false;
    const d = haversine({ lat, lon }, TOWN);
    setStatus(`You are ${fmtKm(d)} from ${REGION.name}, outside the map`);
    if (first) toast(`You're outside the map area (${fmtKm(d)} from ${REGION.name}). Your dot will appear once you're in range.`, 6000);
    return;
  }
  meGroup.visible = true;
  if (gps.recording && accuracy < 40) {
    const last = gps.track[gps.track.length - 1];
    if (!last || haversine(last, { lat, lon }) > 5) {
      gps.track.push({ lat, lon, ele: altitude ?? undefined, t: pos.timestamp });
      store.set('itacare.track', gps.track);
      drawTrack();
    }
  }
  const near = nearestTrail(lat, lon);
  const l = toLocal(lat, lon);
  setStatus(`${lat.toFixed(5)}, ${lon.toFixed(5)} · ${Math.round(heightAt(l.x, l.z))} m · ±${Math.round(accuracy)} m`
    + (near ? ` · ${fmtKm(near.d)} to ${near.t.name}` : ''));
  if (first && !nav.dest) flyTo(l.x, l.z, 1200);
  onNavPosition();
}

function nearestTrail(lat, lon) {
  if (!trails.length) return null;
  const p = toLocal(lat, lon);
  let best = null;
  for (const t of trails) {
    if (t.cat === 'road') continue;
    for (const q of t.pts) {
      const d = Math.hypot(q.x - p.x, q.z - p.z);
      if (!best || d < best.d) best = { d, t };
    }
  }
  return best;
}

function updateMarker() {
  if (!meGroup.visible || !gps.fix) return;
  const l = toLocal(gps.fix.lat, gps.fix.lon);
  const ground = heightAt(l.x, l.z) * settings.exaggeration;
  // Keep the marker a constant size on screen.
  const dist = camera.position.distanceTo(tmpV.set(l.x, ground, l.z));
  const s = dist * 0.012;
  const lift = s * 3;
  meHead.position.set(l.x, ground + lift, l.z);
  meHead.scale.setScalar(s);
  const pulse = 1 + 0.15 * Math.sin(performance.now() / 250);
  meRing.scale.setScalar(pulse);
  meStem.position.set(l.x, ground + lift / 2, l.z);
  meStem.scale.set(s, lift, s);
  meAcc.position.set(l.x, ground + 1, l.z);
  meAcc.scale.setScalar(Math.max(gps.fix.accuracy, 3));
  const hd = gps.fix.heading;
  meArrow.visible = hd != null && !Number.isNaN(hd) && (gps.fix.speed ?? 0) > 0.5;
  if (meArrow.visible) meArrow.rotation.y = -hd * Math.PI / 180;
}

function startGps() {
  if (!('geolocation' in navigator)) { toast('Geolocation is not available on this device.'); return; }
  if (!window.isSecureContext) toast('GPS needs HTTPS (or localhost). Open the app from an https:// address.', 6000);
  if (gps.watchId != null) return;
  setStatus('Finding your location…');
  gps.watchId = navigator.geolocation.watchPosition(onPosition, (err) => {
    toast(err.code === 1 ? 'Location permission denied. Enable it in your browser settings.' : 'Could not get location: ' + err.message, 5000);
    if (err.code === 1) stopGps();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
}
function stopGps() {
  if (gps.recording) { gps.follow = false; $('btnGps').classList.remove('on'); toast('Location stays on while recording.'); return; }
  if (gps.watchId != null) navigator.geolocation.clearWatch(gps.watchId);
  gps.watchId = null; gps.follow = false; meGroup.visible = false;
  $('btnGps').classList.remove('on');
}

$('btnGps').addEventListener('click', () => {
  if (gps.watchId == null) { startGps(); gps.follow = true; $('btnGps').classList.add('on'); toast('Following your location. Drag the map to stop following.'); }
  else if (!gps.follow && gps.fix && inBounds(gps.fix.lat, gps.fix.lon)) {
    gps.follow = true; $('btnGps').classList.add('on');
    const l = toLocal(gps.fix.lat, gps.fix.lon); flyTo(l.x, l.z, 900);
  } else stopGps();
});
controls.addEventListener('start', () => { if (gps.follow) { gps.follow = false; $('btnGps').classList.remove('on'); } });

$('btnRec').addEventListener('click', () => {
  if (!gps.recording) {
    if (gps.track.length && !confirm(`Continue the existing track (${gps.track.length} points)? Cancel starts a new one.`)) gps.track = [];
    gps.recording = true; $('btnRec').classList.add('on');
    startGps(); store.set('itacare.track', gps.track); drawTrack();
    toast('Recording your track. Keep the app open.');
  } else {
    gps.recording = false; $('btnRec').classList.remove('on');
    showTrackSheet();
  }
});

function trackLength(pts) { let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1], pts[i]); return d; }

function exportGpx() {
  const pts = gps.track.map((p) => `      <trkpt lat="${p.lat}" lon="${p.lon}">${p.ele != null ? `<ele>${p.ele.toFixed(1)}</ele>` : ''}<time>${new Date(p.t).toISOString()}</time></trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Itacare 3D Trails" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>${REGION.name} track ${new Date().toISOString().slice(0, 10)}</name><trkseg>
${pts}
  </trkseg></trk>
</gpx>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = `${REGION_ID}-track-${Date.now()}.gpx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---------------------------------------------------------------------------
// Camera helpers
// ---------------------------------------------------------------------------
let flight = null;
function flyTo(x, z, distance = null) {
  const ground = heightAt(x, z) * settings.exaggeration;
  const offset = camera.position.clone().sub(controls.target);
  if (distance) offset.setLength(distance);
  const target = new THREE.Vector3(x, ground, z);
  flight = { fromT: controls.target.clone(), toT: target, fromC: camera.position.clone(), toC: target.clone().add(offset),
    t0: performance.now(), dur: 1100 };
}
function updateFlight() {
  if (!flight) return;
  let t = Math.min((performance.now() - flight.t0) / flight.dur, 1);
  const e = t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  controls.target.lerpVectors(flight.fromT, flight.toT, e);
  camera.position.lerpVectors(flight.fromC, flight.toC, e);
  if (t >= 1) flight = null;
}
function clampTarget() {
  const t = controls.target, hx = T.sizeX / 2, hz = T.sizeZ / 2;
  const cx = Math.min(Math.max(t.x, -hx), hx), cz = Math.min(Math.max(t.z, -hz), hz);
  if (cx !== t.x || cz !== t.z) {
    camera.position.x += cx - t.x; camera.position.z += cz - t.z; t.x = cx; t.z = cz;
  }
  // Never let the camera dip under the ground.
  const g = heightAt(camera.position.x, camera.position.z) * settings.exaggeration + 25;
  if (camera.position.y < g) camera.position.y = g;
}

$('compass').addEventListener('click', () => {
  // Rotate the view back so north is up, keeping distance and tilt.
  const off = camera.position.clone().sub(controls.target);
  const flat = Math.hypot(off.x, off.z);
  flight = { fromT: controls.target.clone(), toT: controls.target.clone(), fromC: camera.position.clone(),
    toC: controls.target.clone().add(new THREE.Vector3(0, off.y, flat)), t0: performance.now(), dur: 600 };
});
function updateCompass() {
  const off = camera.position.clone().sub(controls.target);
  const az = Math.atan2(off.x, off.z); // 0 when looking north
  $('compass').firstElementChild.style.transform = `rotate(${az * 180 / Math.PI}deg)`;
}

// ---------------------------------------------------------------------------
// Tapping: pick a trail (screen space) or report terrain under the finger
// ---------------------------------------------------------------------------
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  if (moved < 8 && performance.now() - downAt.t < 500) onTap(e.clientX, e.clientY);
  downAt = null;
});

function pickTrail(sx, sy) {
  let best = null;
  const v = new THREE.Vector3();
  for (const t of trails) {
    if (!settings.show[t.cat]) continue;
    for (let i = 0; i < t.pts.length; i += 1) {
      v.copy(t.pts[i]); v.y *= settings.exaggeration; v.project(camera);
      if (v.z > 1) continue;
      const d = Math.hypot((v.x + 1) / 2 * innerWidth - sx, (1 - v.y) / 2 * innerHeight - sy);
      // Prefer trails over roads when both are close.
      const score = d + (t.cat === 'road' ? 10 : 0);
      if (score < 22 && (!best || score < best.score)) best = { t, score };
    }
  }
  return best?.t;
}

function groundAtScreen(sx, sy) {
  // March along the camera ray until it goes below the terrain surface.
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(sx / innerWidth * 2 - 1, -(sy / innerHeight) * 2 + 1), camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  for (let s = 0; s < 60000; s += 8) {
    const x = o.x + d.x * s, y = o.y + d.y * s, z = o.z + d.z * s;
    if (y < -10) return null;
    if (Math.abs(x) > T.sizeX / 2 || Math.abs(z) > T.sizeZ / 2) continue;
    if (y <= Math.max(heightAt(x, z), 0) * settings.exaggeration) return { x, z };
  }
  return null;
}

let highlight;
function onTap(sx, sy) {
  const t = pickTrail(sx, sy);
  if (t) { selectTrail(t); return; }
  const g = groundAtScreen(sx, sy);
  if (!g) return;
  const ll = toLatLon(g.x, g.z);
  const h = heightAt(g.x, g.z);
  let html = `<h2>${h < 0 ? 'Atlantic Ocean' : 'Terrain'}</h2><div class="sub">${ll.lat.toFixed(5)}, ${ll.lon.toFixed(5)}</div>`;
  if (h >= 0) html += `<div class="stats"><div class="stat"><b>${Math.round(h)} m</b><span>elevation</span></div>`
    + (gps.fix ? `<div class="stat"><b>${fmtKm(haversine(gps.fix, ll))}</b><span>from you</span></div>` : '')
    + `<div class="stat"><b>${fmtKm(haversine(TOWN, ll))}</b><span>from town</span></div></div>`;
  if (h >= 0) html += routeButtons(ll);
  openSheet(html);
  bindRouteButtons({ name: 'Map point', lat: ll.lat, lon: ll.lon });
}

function selectTrail(t) {
  // Gather every piece of the same named route/trail so stats cover the whole thing.
  const group = t.rel ? trails.filter((o) => o.rel === t.rel)
    : t.tags?.name ? trails.filter((o) => !o.rel && o.cat === t.cat && o.name === t.name) : [t];
  if (highlight) highlight.forEach(disposeLine);
  highlight = group.map((g) => {
    const pts = []; for (const p of g.pts) pts.push(p.x, p.y + 0.5, p.z);
    const l = new Line2(new LineGeometry().setPositions(pts), makeLineMaterial(0x00e5ff, 6, { depthTest: false, transparent: true }));
    l.renderOrder = 5; world.add(l); return l;
  });
  // Elevation profile along the trail.
  const prof = [];
  let dist = 0;
  for (const line of chainSegments(group.map((g) => g.latlon), t.latlon)) {
    for (let i = 0; i < line.length; i++) {
      if (i > 0) dist += haversine(line[i - 1], line[i]);
      const l = toLocal(line[i].lat, line[i].lon);
      prof.push([dist, heightAt(l.x, l.z)]);
    }
  }
  let up = 0, down = 0, min = Infinity, max = -Infinity, last = prof[0][1];
  for (const [, h] of prof) {
    min = Math.min(min, h); max = Math.max(max, h);
    if (Math.abs(h - last) >= 3) { if (h > last) up += h - last; else down += last - h; last = h; } // 3 m hysteresis filters DEM noise
  }
  const tg = t.tags || {};
  const extras = [tg.surface && `surface: ${tg.surface}`, tg.sac_scale && `difficulty: ${tg.sac_scale.replace(/_/g, ' ')}`,
    tg.trail_visibility && `visibility: ${tg.trail_visibility}`, tg.highway && `type: ${tg.highway}`].filter(Boolean).join(' · ');
  openSheet(`<h2>${escapeHtml(t.name)}</h2><div class="sub">${CATEGORIES[t.cat].label}${extras ? ' · ' + escapeHtml(extras) : ''}</div>
    <div class="stats">
      <div class="stat"><b>${fmtKm(dist)}</b><span>length</span></div>
      <div class="stat"><b>↑${Math.round(up)} m</b><span>ascent</span></div>
      <div class="stat"><b>↓${Math.round(down)} m</b><span>descent</span></div>
      <div class="stat"><b>${Math.round(min)} m</b><span>lowest</span></div>
      <div class="stat"><b>${Math.round(max)} m</b><span>highest</span></div>
      <div class="stat"><b>${Math.round(dist / 1000 / 4 * 60 + up / 10)} min</b><span>walk est.</span></div>
    </div>
    <canvas id="profile"></canvas>
    <div class="small">Elevation profile (from SRTM terrain data). Data © OpenStreetMap contributors.</div>
    <div class="row"><button class="pill go" id="routeTrail">🧭 Route to this trail</button></div>`);
  drawProfile($('profile'), prof);
  $('routeTrail').addEventListener('click', () => {
    // Head for the point of the trail closest to the user (or its start).
    let target = group[0].latlon[0];
    if (gps.fix) { let best = Infinity; for (const g of group) for (const q of g.latlon) { const d = haversine(gps.fix, q); if (d < best) { best = d; target = q; } } }
    startNavigation({ name: t.name, lat: target.lat, lon: target.lon });
  });
  const mid = group[0].pts[Math.floor(group[0].pts.length / 2)];
  flyTo(mid.x, mid.z, Math.max(600, Math.min(dist * 1.2, 8000)));
}

// OSM splits a trail into many ways in no particular order. Greedily join
// pieces end-to-end (flipping where needed) so the profile runs along the trail.
function chainSegments(lines, start) {
  const left = lines.filter((l) => l !== start);
  const same = (a, b) => haversine(a, b) < 15;
  let chain = start.slice();
  let grew = true;
  while (grew && left.length) {
    grew = false;
    for (let i = 0; i < left.length; i++) {
      const s = left[i], head = chain[0], tail = chain[chain.length - 1];
      if (same(tail, s[0])) chain = chain.concat(s.slice(1));
      else if (same(tail, s[s.length - 1])) chain = chain.concat(s.slice(0, -1).reverse());
      else if (same(head, s[s.length - 1])) chain = s.slice(0, -1).concat(chain);
      else if (same(head, s[0])) chain = s.slice(1).reverse().concat(chain);
      else continue;
      left.splice(i, 1); grew = true; break;
    }
  }
  return [chain, ...left]; // disconnected leftovers are appended
}

function drawProfile(cv, prof) {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const maxD = prof[prof.length - 1][0] || 1;
  const hs = prof.map((p) => p[1]), lo = Math.min(...hs), hi = Math.max(...hs, lo + 20);
  const X = (d) => 4 + d / maxD * (W - 8), Y = (h) => H - 14 - (h - lo) / (hi - lo) * (H - 24);
  ctx.beginPath(); ctx.moveTo(X(0), H - 14);
  for (const [d, h] of prof) ctx.lineTo(X(d), Y(h));
  ctx.lineTo(X(maxD), H - 14); ctx.closePath();
  ctx.fillStyle = 'rgba(255,181,71,.25)'; ctx.fill();
  ctx.beginPath(); prof.forEach(([d, h], i) => i ? ctx.lineTo(X(d), Y(h)) : ctx.moveTo(X(d), Y(h)));
  ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#9fb6bf'; ctx.font = '10px system-ui';
  ctx.fillText(`${Math.round(hi)} m`, 4, 10); ctx.fillText(`${Math.round(lo)} m`, 4, H - 2);
  ctx.textAlign = 'right'; ctx.fillText(fmtKm(maxD), W - 4, H - 2);
}

  const render = () => {
    const q = $('q').value.toLowerCase();
    return items.filter((v) => (group === 'all' || (group === 'pick' ? v.pick : v.group === group)) && (!q || v.name.toLowerCase().includes(q)
      || (v.tags?.cuisine || '').toLowerCase().includes(q) || (v.pick && (v.pick.kind + ' ' + v.pick.area).toLowerCase().includes(q)))).slice(0, 300).map((v) =>
      `<li data-i="${items.indexOf(v)}"><span>${v.icon}</span><span class="nm">${v.pick ? '⭐ ' : ''}${escapeHtml(v.name)}${v.pick ? `<br><span class="small">${escapeHtml(v.pick.kind)} · ${escapeHtml(v.pick.area)}</span>` : ''}</span>`
      + `<span class="km">${v.rating != null ? ratingBadge(v) + ' ' : ''}${gps.fix ? fmtKm(haversine(gps.fix, v)) : ''}</span><button class="pill go" data-go="${items.indexOf(v)}" title="Route here">🧭</button></li>`).join('');
  };
  openSheet(`${listTabs('food')}<div class="row"><div class="seg" id="grp"><button data-v="all" class="on">All</button>
    ${curated.length ? '<button data-v="pick">⭐ Picks</button>' : ''}
    ${Object.entries(VENUE_GROUPS).map(([k, g]) => `<button data-v="${k}">${g.label}</button>`).join('')}</div></div>
    <input type="search" id="q" placeholder="Search name or cuisine…"><ul class="list" id="tl"></ul>
    ${googleKey() ? '' : '<div class="small" style="margin-top:6px">Tip: add a Google API key in Layers to see ratings.</div>'}`);
  bindListTabs();
  $('tl').innerHTML = render();
  $('q').addEventListener('input', () => { $('tl').innerHTML = render(); });
  $('grp').addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (!v) return; group = v;
    for (const b of $('grp').children) b.classList.toggle('on', b.dataset.v === v);
    $('tl').innerHTML = render();
  });
  $('tl').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { startNavigation(items[+go.dataset.go]); return; }
    const li = e.target.closest('li'); if (li) selectVenue(items[+li.dataset.i]);
  });
}

function showTrailList() {
  if (!trails.length) { toast('Trail data has not loaded yet.'); return; }
  // Combine segments that share a name (OSM splits long trails into many ways).
  const byName = new Map();
  for (const t of trails) {
    if (t.cat === 'road') continue;
    const key = t.rel ? 'r' + t.rel : (t.tags?.name ? t.cat + t.name : t.id);
    const e = byName.get(key) || { t, length: 0 };
    e.length += t.length; byName.set(key, e);
  }
  const items = [...byName.values()].filter((e) => e.length > 150).sort((a, b) =>
    (b.t.cat === 'route') - (a.t.cat === 'route') || (!!b.t.tags?.name - !!a.t.tags?.name) || b.length - a.length);
  const hex = (c) => '#' + c.toString(16).padStart(6, '0');
  const render = (q) => items.filter((e) => !q || e.t.name.toLowerCase().includes(q)).slice(0, 200).map((e, i) =>
    `<li data-i="${items.indexOf(e)}"><span class="sw" style="background:${hex(CATEGORIES[e.t.cat].color)}"></span><span class="nm">${escapeHtml(e.t.name)}</span><span class="km">${fmtKm(e.length)}</span></li>`).join('');
  openSheet(`${listTabs('trails')}<input type="search" id="q" placeholder="Search ${items.length} trails…"><ul class="list" id="tl">${render('')}</ul>`);
  bindListTabs();
  $('q').addEventListener('input', (e) => { $('tl').innerHTML = render(e.target.value.toLowerCase()); });
  $('tl').addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) selectTrail(items[+li.dataset.i].t); });
}

function showTrackSheet() {
  const len = trackLength(gps.track);
  openSheet(`<h2>My track</h2><div class="sub">${gps.track.length} points · ${fmtKm(len)}</div>
    <div class="row"><button class="pill" id="gpx" ${gps.track.length < 2 ? 'disabled' : ''}>Download GPX</button>
    <button class="pill" id="clearTrack">Clear track</button></div>`);
  $('gpx').addEventListener('click', exportGpx);
  $('clearTrack').addEventListener('click', () => { gps.track = []; store.set('itacare.track', []); drawTrack(); closeSheet(); });
}

// ---------------------------------------------------------------------------
// Loading sequence
// ---------------------------------------------------------------------------
const trailSummary = () => `${trails.filter((t) => t.cat !== 'road').length} ${REGION.roads === 'all' ? 'trail' : 'path'} segments · ${venues.length} places to eat & drink`;

async function loadTrails(force = false) {
  if (!gps.fix) setStatus('Loading trails from OpenStreetMap…');
  try {
    let osm = force ? null : await cachedOSM();
    if (!osm) {
      osm = await fetchOSM();
      saveOSM(osm);
    }
    buildTrails(osm);
    if (!gps.fix) setStatus(trailSummary());
    if (force) toast('Map data refreshed.');
  } catch (e) {
    console.warn(e);
    if (curated.length && !trails.length) buildTrails({ elements: [] });   // still show the curated picks
    if (!gps.fix) setStatus('Streets unavailable (offline?) — terrain only');
    toast('Could not load trails from OpenStreetMap. They will load next time you are online.', 5000);
  }
}

function animate() {
  requestAnimationFrame(animate);
  updateFlight();
  if (gps.follow && gps.fix && !flight && inBounds(gps.fix.lat, gps.fix.lon)) {
    // Gently keep the target on the user while following.
    const l = toLocal(gps.fix.lat, gps.fix.lon);
    const goal = new THREE.Vector3(l.x, heightAt(l.x, l.z) * settings.exaggeration, l.z);
    const delta = goal.sub(controls.target).multiplyScalar(0.1);
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.update();
  clampTarget();
  updateMarker();
  updateDetail();
  updateLabels();
  updateVenues();
  updateCompass();
  renderer.render(scene, camera);
}

async function main() {
  progress(0.1, 'Loading elevation data…');
  await loadTerrain();
  applyExaggeration();
  progress(0.5, 'Placing camera…');
  const town = toLocal(TOWN.lat, TOWN.lon);
  const ground = heightAt(town.x, town.z) * settings.exaggeration;
  controls.target.set(town.x, ground, town.z + 1500);
  camera.position.set(town.x + 2500, ground + 3200, town.z + 6500);
  if (REGION.curated) {
    try { curated = (await (await fetch(REGION.curated)).json()).places; } catch (e) { console.warn('curated picks', e); }
  }
  controls.update();
  drawTrack();
  animate();
  progress(1);
  setTimeout(() => $('loading').classList.add('hide'), 150);

  // Imagery, trails and ratings load in the background; the map is usable meanwhile.
  loadTrails().then(() => loadRatings());
  setStatus('Loading satellite imagery…');
  // GPS readouts take priority over loading messages in the status line.
  initImagery().then(() => loadBaseImagery((p) => { if (p < 1 && !gps.fix) setStatus(`Loading satellite imagery… ${Math.round(p * 100)}%`); }))
    .then((tex) => { baseTexture = tex; applyLayer(); })
    .catch(() => { toast('Satellite imagery unavailable — showing topo map.'); settings.layer = 'topo'; applyLayer(); })
    .finally(() => { if (!gps.fix) setStatus(trails.length ? trailSummary() : 'Trails unavailable (offline?) — terrain only'); });
  applyLayer();
}

main().catch((e) => { console.error(e); progress(1, 'Failed to load: ' + e.message); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e)));
}
</script>
</body>
</html>
