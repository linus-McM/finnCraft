<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>São Paulo Eats &amp; Markets</title>
<meta name="description" content="Key markets, restaurants, bars and cafés of São Paulo with Google ratings, live GPS and a route from where you are.">
<meta name="theme-color" content="#121a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root {
    --bg: #121a2b;
    --panel: rgba(18, 26, 43, 0.9);
    --text: #eef2f7;
    --muted: #9fb0c4;
    --accent: #ffb547;
    --gps: #2f8cff;
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #map { position: fixed; inset: 0; background: #1b2436; }
  .leaflet-container { font: inherit; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(255,255,255,.75); }
  .leaflet-control-zoom { display: none; }

  /* Place markers: emoji disc + rating badge + name (name only when zoomed in) */
  .pm { width: 0; height: 0; }
  .pm .in { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .pm .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 16px;
    background: #fff; border: 2.5px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .pm .rt { margin-top: 2px; font-size: 10px; font-weight: 700; color: #1b1300; background: var(--rc, #ffd34d); border-radius: 6px;
    padding: 0 4px; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .pm .nm { display: none; max-width: 120px; text-align: center; font-size: 10px; font-weight: 600; color: #111; line-height: 1.15;
    text-shadow: 0 0 3px #fff, 0 0 2px #fff, 0 1px 2px #fff; margin-top: 1px; }
  .leaflet-container.names .pm .nm, .pm.sel .nm { display: block; }
  .pm.sel .ic { transform: scale(1.3); border-color: #00e5ff; }
  .pm.dim { opacity: .35; }
  .stars { color: #ffd34d; letter-spacing: 1px; }

  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 14px; z-index: 1000; }
  #top { top: calc(env(safe-area-inset-top) + 10px); left: 10px; right: 10px; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px; }
  #top h1 { font-size: 15px; margin: 0; font-weight: 700; flex: 1; min-width: 0; }
  #top h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  #controls { right: 10px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column;
    gap: 8px; background: none; border: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn svg { width: 24px; height: 24px; }
  .btn.on { background: var(--gps); border-color: var(--gps); }

  #sheet { left: 10px; bottom: calc(env(safe-area-inset-bottom) + 14px); width: min(380px, calc(100% - 80px));
    max-height: 60vh; overflow: auto; padding: 12px 14px; display: none; }
  #sheet.open { display: block; }
  #sheet h2 { font-size: 15px; margin: 0 0 4px; padding-right: 28px; }
  #sheet .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #sheet .close { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.08); color: var(--text); font-size: 16px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .stat { background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row label { display: flex; gap: 6px; align-items: center; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: none; border: none; color: var(--text); padding: 6px 10px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: #1b1300; font-weight: 600; }
  .list { margin: 6px 0 0; padding: 0; list-style: none; }
  .list li { padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .list li .nm { flex: 1; min-width: 0; overflow: hidden; }
  .list li .nm b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .list li .km { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .list li .pill.go { padding: 4px 8px; flex: none; }
  .rbadge { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 6px; font-weight: 700;
    font-size: 12px; color: #1b1300; background: var(--rc, #ffd34d); }
  .small { color: var(--muted); font-size: 11px; }
  .notes { margin: 6px 0; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=search] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(0,0,0,.25); color: var(--text); font: inherit; }
  a { color: var(--accent); }
  .pill { text-decoration: none; display: inline-block; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06);
    color: var(--text); cursor: pointer; font: inherit; }
  .pill.go { background: #00ff88; color: #00351c; font-weight: 700; border-color: #00ff88; }

  #nav { left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 70px); display: none; align-items: center;
    gap: 8px; padding: 8px 10px 8px 12px; border-color: rgba(0,255,136,.5); }
  #nav .txt { flex: 1; min-width: 0; font-size: 13px; }
  #nav button { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.1); color: var(--text);
    cursor: pointer; flex: none; font-size: 14px; }
  #toast { left: 50%; top: calc(env(safe-area-inset-top) + 124px); transform: translateX(-50%); padding: 8px 14px;
    max-width: calc(100% - 40px); text-align: center; display: none; z-index: 1001; }
  #toast.show { display: block; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 2000; transition: opacity .4s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .box { text-align: center; }
</style>
<script src="../config.js"></script>
<script src="vendor/leaflet.js"></script>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <h1>São Paulo Eats &amp; Markets<small id="status">Loading…</small></h1>
</div>

<div id="controls" class="panel">
  <button class="btn" id="btnLayers" title="Layers &amp; settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 16 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
  </button>
  <button class="btn" id="btnList" title="Markets, restaurants, bars, cafés &amp; sights">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <button class="btn" id="btnGps" title="Show my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div id="sheet" class="panel"><button class="close" id="sheetClose">×</button><div id="sheetBody"></div></div>
<div id="nav" class="panel"><span class="txt"></span><button id="navMode" title="Switch travel mode">🚶</button><button id="navFit" title="Show whole route">⤢</button><button id="navStop" title="Stop">✕</button></div>
<div id="toast" class="panel"></div>

<div id="loading"><div class="box"><div>Loading São Paulo…</div><div class="small" id="loadmsg" style="margin-top:8px"></div></div></div>

<script type="module">
// ---------------------------------------------------------------------------
// Settings & small helpers
// ---------------------------------------------------------------------------
const CITY = { lat: -23.5505, lon: -46.6333, name: 'Praça da Sé' };      // city centre (Marco Zero)
// Greater São Paulo: GPS fixes outside this box are shown as "away from the city".
const BOUNDS = { south: -23.85, north: -23.30, west: -46.95, east: -46.30 };
const inBounds = (lat, lon) => lat >= BOUNDS.south && lat <= BOUNDS.north && lon >= BOUNDS.west && lon <= BOUNDS.east;

const GROUPS = {
  market:     { label: 'Markets', icon: '🧺', color: '#ffd34d' },
  restaurant: { label: 'Restaurants', icon: '🍽️', color: '#ff7a59' },
  bar:        { label: 'Bars', icon: '🍹', color: '#b47bff' },
  cafe:       { label: 'Cafés', icon: '☕', color: '#c8915a' },
  sight:      { label: 'Sights', icon: '📍', color: '#9ff0ff' },
};
const FOOD = ['restaurant', 'bar', 'cafe'];

const BASEMAPS = {
  voyager: { label: 'Streets', url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' },
  dark:    { label: 'Dark', url: 'https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' },
  osm:     { label: 'OSM classic', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' },
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const saved = store.get('sp.settings', {});
// The deploy workflow writes the Google key into ../config.js (shared with the Itacaré app).
const BUILT_IN_KEY = (window.ITACARE_CONFIG && window.ITACARE_CONFIG.googleKey) || '';
const settings = Object.assign({ basemap: 'voyager', minRating: 0, googleKey: '', routeMode: 'walk', sort: 'rating' }, saved, {
  show: Object.assign({ market: true, restaurant: true, bar: true, cafe: true, sight: true }, saved.show || {}),
});
const saveSettings = () => store.set('sp.settings', settings);
const googleKey = () => settings.googleKey || BUILT_IN_KEY;

let toastTimer;
function toast(msg, ms = 3500) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function setStatus(msg) { $('status').textContent = msg; }
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtKm = (m) => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' km' : Math.round(m) + ' m';
const fmtMin = (s) => s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min` : `${Math.max(1, Math.round(s / 60))} min`;
function haversine(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearingText(a, b) {
  const toR = Math.PI / 180;
  const y = Math.sin((b.lon - a.lon) * toR) * Math.cos(b.lat * toR);
  const x = Math.cos(a.lat * toR) * Math.sin(b.lat * toR) - Math.sin(a.lat * toR) * Math.cos(b.lat * toR) * Math.cos((b.lon - a.lon) * toR);
  const deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8];
}

// ---------------------------------------------------------------------------
// Map
// ---------------------------------------------------------------------------
const map = L.map('map', { zoomControl: false, attributionControl: true, tap: false }).setView([CITY.lat, CITY.lon], 13);
let baseLayer = null;
function applyBasemap() {
  const b = BASEMAPS[settings.basemap] || BASEMAPS.voyager;
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(b.url, { attribution: b.attribution, maxZoom: 19, subdomains: 'abcd', crossOrigin: true }).addTo(map);
}
applyBasemap();
const updateNameClass = () => map.getContainer().classList.toggle('names', map.getZoom() >= 16);
map.on('zoomend', updateNameClass); updateNameClass();

// ---------------------------------------------------------------------------
// Places: the curated list from data/places.json, with Google ratings on top
// (the same way the Itacaré app rates its restaurants: Google rating, plus a
// badge colour showing how many reviews a place has compared with the others).
// ---------------------------------------------------------------------------
let places = [];        // { id, name, group, kind, lat, lon, area, notes, hours?, rating?, ratingCount?, gUri?, price?, openNow?, marker }
let selected = null;
const markerLayer = L.layerGroup().addTo(map);

const stars = (r) => '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
// Review-count confidence colour, relative to every other rated place on the map:
// the place's percentile of review count maps onto a red → amber → green gradient.
let reviewCounts = [];
function updateReviewScale() {
  reviewCounts = places.filter((p) => p.rating != null).map((p) => p.ratingCount ?? 0).sort((a, b) => a - b);
}
function reviewRank(n) {
  if (!reviewCounts.length) return 0.5;
  let lo = 0, hi = reviewCounts.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (reviewCounts[m] < n) lo = m + 1; else hi = m; }
  let lo2 = lo, hi2 = reviewCounts.length;
  while (lo2 < hi2) { const m = (lo2 + hi2) >> 1; if (reviewCounts[m] <= n) lo2 = m + 1; else hi2 = m; }
  return reviewCounts.length === 1 ? 1 : ((lo + lo2 - 1) / 2) / (reviewCounts.length - 1);
}
const lerpHex = (a, b, t) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(a.slice(1 + i, 3 + i), 16) * (1 - t)
  + parseInt(b.slice(1 + i, 3 + i), 16) * t).toString(16).padStart(2, '0')).join('');
function reviewColor(n) {
  const r = Math.max(0, Math.min(1, reviewRank(n ?? 0)));
  return r < 0.5 ? lerpHex('#ff5a5f', '#ffb547', r * 2) : lerpHex('#ffb547', '#3ddc84', (r - 0.5) * 2);
}
const ratingBadge = (p) => `<span class="rbadge" style="--rc:${reviewColor(p.ratingCount)}" title="${p.ratingCount ?? 0} Google reviews">${p.rating.toFixed(1)}</span>`;
const googleListingUrl = (p) => `https://www.google.com/search?q=${encodeURIComponent(p.name + ' São Paulo')}`;

const placeVisible = (p) => settings.show[p.group]
  && (!settings.minRating || p.group === 'sight' || (p.rating != null && p.rating >= settings.minRating));

function markerHtml(p) {
  return `<div class="in"><span class="ic" style="--c:${GROUPS[p.group].color}">${GROUPS[p.group].icon}</span>`
    + (p.rating != null ? `<span class="rt" style="--rc:${reviewColor(p.ratingCount)}">${p.rating.toFixed(1)}</span>` : '')
    + `<span class="nm">${escapeHtml(p.name)}</span></div>`;
}
function markerIcon(p) {
  return L.divIcon({ className: 'pm' + (p === selected ? ' sel' : ''), html: markerHtml(p), iconSize: [0, 0], iconAnchor: [0, 0] });
}
function buildMarkers() {
  markerLayer.clearLayers();
  for (const p of places) {
    p.marker = L.marker([p.lat, p.lon], { icon: markerIcon(p), riseOnHover: true, keyboard: false });
    p.marker.on('click', () => selectPlace(p));
    // Best-rated places draw on top when markers overlap.
    p.marker.setZIndexOffset(Math.round((p.rating ?? 0) * 100 + Math.min(p.ratingCount ?? 0, 9999) / 100));
  }
  applyVisibility();
}
function applyVisibility() {
  for (const p of places) {
    const on = placeVisible(p);
    if (on && !markerLayer.hasLayer(p.marker)) markerLayer.addLayer(p.marker);
    if (!on && markerLayer.hasLayer(p.marker)) markerLayer.removeLayer(p.marker);
  }
}
function refreshMarker(p) { p.marker?.setIcon(markerIcon(p)); if (p === selected) p.marker?.setZIndexOffset(100000); }

function selectPlace(p) {
  const prev = selected; selected = p;
  if (prev) refreshMarker(prev);
  refreshMarker(p);
  const g = GROUPS[p.group];
  const ratingHtml = p.rating != null
    ? `<div class="row">${ratingBadge(p)}<span class="stars">${stars(p.rating)}</span><span class="small" style="color:${reviewColor(p.ratingCount)}">${p.ratingCount ?? 0} Google reviews</span>${p.price ? `<span class="small">· ${p.price}</span>` : ''}</div>`
    : p.group === 'sight' ? '' : `<div class="small" style="margin:6px 0">No rating loaded${googleKey() ? ' yet' : ' — add a Google API key in Layers to load ratings'}.</div>`;
  const mapsUrl = p.gUri || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' São Paulo')}`;
  const hours = p.gHours ? p.gHours.map(escapeHtml).join('<br>') : p.hours ? escapeHtml(p.hours) : '';
  openSheet(`<h2>${g.icon} ${escapeHtml(p.name)}</h2>
    <div class="sub">${escapeHtml(p.kind)} · ${escapeHtml(p.area)}${p.openNow != null ? (p.openNow ? ' · <b style="color:#5be38a">Open now</b>' : ' · <b style="color:#ff8a8a">Closed now</b>') : ''}</div>
    ${ratingHtml}
    ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
    <div class="stats">
      ${gps.fix ? `<div class="stat"><b>${fmtKm(haversine(gps.fix, p))}</b><span>from you</span></div>` : ''}
      <div class="stat"><b>${fmtKm(haversine(CITY, p))}</b><span>from Sé</span></div>
      ${gps.fix ? `<div class="stat"><b>${bearingText(gps.fix, p)}</b><span>direction</span></div>` : ''}
    </div>
    ${hours ? `<details ${p.gHours ? '' : 'open'}><summary class="small" style="cursor:pointer">Hours</summary><div class="small">${hours}</div></details>` : ''}
    ${p.address ? `<div class="small" style="margin-top:4px">${escapeHtml(p.address)}</div>` : ''}
    ${routeButtons(p)}
    <div class="row">
      <a class="pill" target="_blank" rel="noopener" href="${escapeHtml(mapsUrl)}">Google Maps ↗</a>
      <a class="pill" target="_blank" rel="noopener" href="${escapeHtml(googleListingUrl(p))}">Google listing ↗</a>
    </div>
    <div class="small">${p.rating != null ? 'Rating, hours and location from Google. ' : ''}Map data © OpenStreetMap contributors.</div>`);
  bindRouteButtons(p);
  map.panTo([p.lat, p.lon], { animate: true });
  if (map.getZoom() < 15) map.setZoom(15);
}

// Shared "Route here" + Google directions buttons (transit is Google-only: no free
// public-transport router covers São Paulo's metro and buses).
function routeButtons(dest) {
  const m = ROUTE_MODES[settings.routeMode];
  const dir = (mode) => `https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lon}&travelmode=${mode}`;
  return `<div class="row">
    <button class="pill go" id="routeHere">🧭 Route here (${m.label.toLowerCase()})</button>
    <a class="pill" target="_blank" rel="noopener" href="${dir('transit')}">🚇 Metro / bus ↗</a>
    <a class="pill" target="_blank" rel="noopener" href="${dir(m.google)}">Google ↗</a>
  </div>`;
}
function bindRouteButtons(dest) { $('routeHere')?.addEventListener('click', () => startNavigation(dest)); }

// --- Google Places ratings -------------------------------------------------
// One Text Search per place (biased to its approximate position), cached for a week.
const RATINGS_CACHE = 'sp-ratings-v1', RATINGS_KEY = 'google-places.json';
const RATINGS_MAX_AGE = 7 * 24 * 3600 * 1000;
let googlePlaces = null;   // { [placeId]: GooglePlace }

const plainName = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const normName = (s) => plainName(s).replace(/\(.*?\)/g, '')
  .replace(/\b(restaurante|restaurant|bar|cafe|cafeteria|pizzaria|lanchonete|mercado|municipal|feira|de|do|da|dos|das|the|e|sao|paulo|sp)\b/g, '')
  .replace(/[^a-z0-9]/g, '');
// Same place? Compare names without filler words ("Mercado Municipal de…", "Bar do…");
// names made only of filler words (the Mercadão) fall back to the full name.
function sameName(a, b) {
  const x = normName(a), y = normName(b);
  if (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x))) return true;
  const px = plainName(a).replace(/[^a-z0-9]/g, ''), py = plainName(b).replace(/[^a-z0-9]/g, '');
  return px === py || (Math.min(px.length, py.length) >= 8 && (px.includes(py) || py.includes(px)));
}

async function searchGoogle(key, p) {
  const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': key,
      'X-Goog-FieldMask': 'places.id,places.displayName,places.location,places.rating,places.userRatingCount,places.googleMapsUri,'
        + 'places.priceLevel,places.formattedAddress,places.currentOpeningHours.openNow,places.regularOpeningHours.weekdayDescriptions',
    },
    body: JSON.stringify({ textQuery: p.name.replace(/\(.*?\)/g, '').trim() + ', São Paulo', pageSize: 5, languageCode: 'en',
      locationBias: { circle: { center: { latitude: p.lat, longitude: p.lon }, radius: 1500 } } }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
  // Best candidate: a matching name, nearest to where we think the place is.
  let best = null, bestD = 2500;
  for (const g of json.places || []) {
    const lat = g.location?.latitude, lon = g.location?.longitude;
    if (lat == null) continue;
    const d = haversine(p, { lat, lon });
    if (sameName(p.name, g.displayName?.text || '') && d < bestD) { best = g; bestD = d; }
  }
  return best;
}

async function fetchGooglePlaces(key) {
  const out = {};
  const queue = places.filter((p) => p.group !== 'sight' || true);   // sights get hours and exact positions too
  let done = 0, failed = 0;
  await Promise.all(Array.from({ length: 4 }, async () => {
    while (queue.length) {
      const p = queue.shift();
      try { const g = await searchGoogle(key, p); if (g) out[p.id] = g; }
      catch (e) { failed++; if (failed > 5) throw e; }
      done++;
      if (!gps.fix) setStatus(`Loading Google ratings… ${done}/${places.length}`);
    }
  }));
  return out;
}

function applyRatings() {
  if (googlePlaces) {
    for (const p of places) {
      for (const k of ['rating', 'ratingCount', 'gUri', 'price', 'openNow', 'gHours', 'address']) delete p[k];
      const g = googlePlaces[p.id];
      if (!g) continue;
      if (g.rating != null) { p.rating = g.rating; p.ratingCount = g.userRatingCount ?? 0; }
      p.gUri = g.googleMapsUri;
      p.price = { PRICE_LEVEL_INEXPENSIVE: '$', PRICE_LEVEL_MODERATE: '$$', PRICE_LEVEL_EXPENSIVE: '$$$', PRICE_LEVEL_VERY_EXPENSIVE: '$$$$' }[g.priceLevel];
      p.openNow = g.currentOpeningHours?.openNow;
      p.gHours = g.regularOpeningHours?.weekdayDescriptions;
      p.address = g.formattedAddress;
      // Google's position is exact; ours is approximate.
      if (g.location?.latitude != null) { p.lat0 ??= p.lat; p.lon0 ??= p.lon; p.lat = g.location.latitude; p.lon = g.location.longitude; }
    }
  }
  updateReviewScale();
  buildMarkers();
}

async function loadRatings(force = false) {
  const key = googleKey();
  if (!key) return;
  try {
    const cache = await caches.open(RATINGS_CACHE);
    const hit = force ? null : await cache.match(RATINGS_KEY);
    const cached = hit ? await hit.json() : null;
    if (cached && Date.now() - cached.t < RATINGS_MAX_AGE && cached.n === places.length) googlePlaces = cached.places;
    else {
      if (force) toast('Loading ratings from Google…');
      googlePlaces = await fetchGooglePlaces(key);
      await cache.put(RATINGS_KEY, new Response(JSON.stringify({ t: Date.now(), n: places.length, places: googlePlaces })));
      toast(`Loaded Google ratings for ${Object.values(googlePlaces).filter((g) => g.rating != null).length} places.`);
    }
    applyRatings();
    if (!gps.fix) setStatus(summary());
    if (selected) selectPlace(selected);
  } catch (e) {
    console.warn(e);
    toast('Could not load Google ratings: ' + e.message, 7000);
    if (!gps.fix) setStatus(summary());
  }
}

// ---------------------------------------------------------------------------
// Routing: from the live GPS position to a chosen place along the real street
// network. Valhalla's public server first (it has proper walking and cycling
// profiles), then the OSRM demo server, then a straight line.
// ---------------------------------------------------------------------------
const ROUTE_MODES = {
  walk: { icon: '🚶', label: 'Walk', kmh: 4.8, valhalla: 'pedestrian', osrm: 'foot', google: 'walking' },
  bike: { icon: '🛵', label: 'Bike / moped', kmh: 14, valhalla: 'bicycle', osrm: 'bike', google: 'bicycling' },
  car:  { icon: '🚗', label: 'Car / taxi', kmh: 22, valhalla: 'auto', osrm: 'driving', google: 'driving' },
};

// Google-style encoded polyline (Valhalla uses 1e6 precision).
function decodePolyline(str, precision = 6) {
  const factor = 10 ** precision, pts = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (const which of ['lat', 'lon']) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = result & 1 ? ~(result >> 1) : result >> 1;
      if (which === 'lat') lat += d; else lon += d;
    }
    pts.push({ lat: lat / factor, lon: lon / factor });
  }
  return pts;
}

const withTimeout = (ms, signal) => {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  signal?.addEventListener('abort', () => c.abort());
  return { signal: c.signal, done: () => clearTimeout(t) };
};

async function routeValhalla(from, to, mode, signal) {
  const q = { locations: [{ lat: from.lat, lon: from.lon }, { lat: to.lat, lon: to.lon }], costing: ROUTE_MODES[mode].valhalla,
    units: 'kilometers', directions_type: 'none' };
  const t = withTimeout(12000, signal);
  try {
    const res = await fetch('https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify(q)), { signal: t.signal });
    if (!res.ok) throw new Error('Valhalla ' + res.status);
    const j = await res.json();
    const leg = j.trip?.legs?.[0];
    if (!leg?.shape) throw new Error('Valhalla: no route');
    return { points: decodePolyline(leg.shape, 6), length: j.trip.summary.length * 1000, duration: j.trip.summary.time, source: 'Valhalla' };
  } finally { t.done(); }
}
async function routeOSRM(from, to, mode, signal) {
  const t = withTimeout(12000, signal);
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/${ROUTE_MODES[mode].osrm}/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson`, { signal: t.signal });
    if (!res.ok) throw new Error('OSRM ' + res.status);
    const j = await res.json();
    const r = j.routes?.[0];
    if (!r) throw new Error('OSRM: no route');
    const m = ROUTE_MODES[mode];
    // The demo server only has a car profile, so re-estimate the time for the chosen mode.
    return { points: r.geometry.coordinates.map(([lon, lat]) => ({ lat, lon })), length: r.distance,
      duration: mode === 'car' ? r.duration : r.distance / 1000 / m.kmh * 3600, source: 'OSRM (car network)' };
  } finally { t.done(); }
}
async function fetchRoute(from, to, mode, signal) {
  try { return await routeValhalla(from, to, mode, signal); } catch (e) { if (signal?.aborted) throw e; console.warn(e); }
  try { return await routeOSRM(from, to, mode, signal); } catch (e) { if (signal?.aborted) throw e; console.warn(e); }
  return { points: [{ lat: from.lat, lon: from.lon }, { lat: to.lat, lon: to.lon }], length: haversine(from, to),
    duration: haversine(from, to) / 1000 / ROUTE_MODES[mode].kmh * 3600, straight: true, source: 'straight line' };
}

const nav = { dest: null, route: null, line: null, lastCalc: 0, pending: false, abort: null, busy: false };

function startNavigation(dest) {
  nav.dest = { name: dest.name || 'Destination', lat: dest.lat, lon: dest.lon };
  closeSheet();
  if (!gps.fix) {
    nav.pending = true;
    startGps();
    gps.follow = true; $('btnGps').classList.add('on');
    showNav('Finding your location…');
    return;
  }
  gps.follow = true; $('btnGps').classList.add('on');
  computeRoute(true);
}

async function computeRoute(fit = false) {
  if (!nav.dest || !gps.fix) return;
  nav.lastCalc = performance.now();
  nav.pending = false;
  nav.abort?.abort();
  const ctl = new AbortController(); nav.abort = ctl;
  const dest = nav.dest;
  if (!nav.route) showNav(`${ROUTE_MODES[settings.routeMode].icon} Finding a route to <b>${escapeHtml(dest.name)}</b>…`);
  let r;
  try { r = await fetchRoute(gps.fix, dest, settings.routeMode, ctl.signal); }
  catch { return; }                       // superseded by a newer request
  if (ctl.signal.aborted || nav.dest !== dest) return;
  nav.route = r;
  drawRoute();
  updateNavBanner();
  if (fit) fitRoute();
}

function drawRoute() {
  if (nav.line) { map.removeLayer(nav.line); nav.line = null; }
  if (!nav.route) return;
  const latlngs = nav.route.points.map((p) => [p.lat, p.lon]);
  nav.line = L.layerGroup([
    L.polyline(latlngs, { color: '#003d1f', weight: 9, opacity: .55, lineCap: 'round' }),
    L.polyline(latlngs, { color: nav.route.straight ? '#ffffff' : '#00ff88', weight: 5, opacity: .95, lineCap: 'round', dashArray: nav.route.straight ? '10 10' : null }),
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 6, color: '#fff', fillColor: '#00ff88', fillOpacity: 1, weight: 2 }),
  ]).addTo(map);
}
function fitRoute() {
  if (!nav.route) return;
  map.fitBounds(L.latLngBounds(nav.route.points.map((p) => [p.lat, p.lon])), { padding: [60, 60], maxZoom: 17 });
  gps.follow = false; $('btnGps').classList.remove('on');
}

// Remaining distance along the route from the user's current position.
function routeProgress() {
  const pts = nav.route.points;
  const cosLat = Math.cos(gps.fix.lat * Math.PI / 180), kx = 111320 * cosLat, ky = 110540;
  const loc = pts.map((q) => ({ x: (q.lon - gps.fix.lon) * kx, y: (q.lat - gps.fix.lat) * ky }));
  let best = { d: Infinity, i: 1, t: 0 };
  for (let i = 1; i < loc.length; i++) {
    const A = loc[i - 1], B = loc[i], dx = B.x - A.x, dy = B.y - A.y, l2 = dx * dx + dy * dy;
    let t = l2 ? (-A.x * dx - A.y * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(A.x + dx * t, A.y + dy * t);
    if (d < best.d) best = { d, i, t };
  }
  let remaining = haversine(pts[best.i - 1], pts[best.i]) * (1 - best.t);
  for (let i = best.i + 1; i < pts.length; i++) remaining += haversine(pts[i - 1], pts[i]);
  return { offRoute: best.d, remaining };
}

function updateNavBanner() {
  if (!nav.dest || !nav.route || !gps.fix) return;
  const pr = routeProgress();
  const m = ROUTE_MODES[settings.routeMode];
  const secs = nav.route.length > 0 ? nav.route.duration * pr.remaining / nav.route.length : pr.remaining / 1000 / m.kmh * 3600;
  showNav(`${m.icon} <b>${escapeHtml(nav.dest.name)}</b> · ${fmtKm(pr.remaining)} · ~${fmtMin(secs)} · ${bearingText(gps.fix, nav.dest)}`
    + (nav.route.straight ? ' · <i>no router reachable, straight line</i>' : pr.offRoute > 50 ? ' · <i>off route</i>' : '')
    + (nav.route.source?.startsWith('OSRM') && settings.routeMode !== 'car' ? ' · <i>car roads</i>' : ''));
}
function showNav(html) { const el = $('nav'); el.querySelector('.txt').innerHTML = html; el.style.display = 'flex'; }
function stopNavigation() {
  nav.dest = null; nav.route = null; nav.pending = false; clearTimeout(nav.retry); nav.abort?.abort();
  if (nav.line) { map.removeLayer(nav.line); nav.line = null; }
  $('nav').style.display = 'none';
}
$('navStop').addEventListener('click', stopNavigation);
$('navFit').addEventListener('click', () => { if (nav.route && gps.fix) fitRoute(); });
function setRouteMode(mode) {
  settings.routeMode = mode; saveSettings();
  $('navMode').textContent = ROUTE_MODES[mode].icon;
  $('navMode').title = `${ROUTE_MODES[mode].label} — tap to switch`;
  if (nav.dest && gps.fix) computeRoute(false);
  toast(`Routing for ${ROUTE_MODES[mode].label.toLowerCase()}.`);
}
const MODE_ORDER = Object.keys(ROUTE_MODES);
$('navMode').addEventListener('click', () => setRouteMode(MODE_ORDER[(MODE_ORDER.indexOf(settings.routeMode) + 1) % MODE_ORDER.length]));
$('navMode').textContent = ROUTE_MODES[settings.routeMode].icon;

function onNavPosition() {
  if (!nav.dest) return;
  if (nav.pending || !nav.route) { computeRoute(true); return; }
  if (haversine(gps.fix, nav.dest) < 30) {
    toast(`You have arrived at ${nav.dest.name}.`, 6000);
    stopNavigation();
    return;
  }
  const pr = routeProgress();
  // Re-route when the user has clearly left the path (and not more than every 15 s).
  if (pr.offRoute > 50) {
    const wait = 15000 - (performance.now() - nav.lastCalc);
    if (wait <= 0) { computeRoute(false); return; }
    clearTimeout(nav.retry);
    nav.retry = setTimeout(() => { if (nav.dest && nav.route && routeProgress().offRoute > 50) computeRoute(false); }, wait);
  }
  updateNavBanner();
}

// ---------------------------------------------------------------------------
// GPS location
// ---------------------------------------------------------------------------
const gps = { watchId: null, fix: null, follow: false };
const meDot = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#2f8cff', fillOpacity: 1 });
const meAcc = L.circle([0, 0], { radius: 0, color: '#2f8cff', weight: 1, fillColor: '#2f8cff', fillOpacity: .15 });
const meLayer = L.layerGroup([meAcc, meDot]);

function nearestPlace(pt) {
  let best = null;
  for (const p of places) { const d = haversine(pt, p); if (!best || d < best.d) best = { d, p }; }
  return best;
}

function onPosition(pos) {
  const { latitude: lat, longitude: lon, accuracy, heading, speed } = pos.coords;
  const first = !gps.fix;
  gps.fix = { lat, lon, accuracy, heading, speed, t: pos.timestamp };
  meDot.setLatLng([lat, lon]); meAcc.setLatLng([lat, lon]); meAcc.setRadius(Math.max(accuracy, 5));
  if (!map.hasLayer(meLayer)) meLayer.addTo(map);
  if (!inBounds(lat, lon)) {
    setStatus(`You are ${fmtKm(haversine({ lat, lon }, CITY))} from São Paulo`);
    if (first) toast(`You're ${fmtKm(haversine({ lat, lon }, CITY))} from São Paulo; routes will work once you're in the city.`, 6000);
  } else {
    const near = nearestPlace(gps.fix);
    setStatus(`±${Math.round(accuracy)} m` + (near ? ` · ${fmtKm(near.d)} to ${near.p.name}` : ''));
  }
  if (first && !nav.dest) map.setView([lat, lon], Math.max(map.getZoom(), 15));
  else if (gps.follow) map.panTo([lat, lon], { animate: true });
  onNavPosition();
}

function startGps() {
  if (!('geolocation' in navigator)) { toast('Geolocation is not available on this device.'); return; }
  if (!window.isSecureContext) toast('GPS needs HTTPS (or localhost). Open the app from an https:// address.', 6000);
  if (gps.watchId != null) return;
  setStatus('Finding your location…');
  gps.watchId = navigator.geolocation.watchPosition(onPosition, (err) => {
    toast(err.code === 1 ? 'Location permission denied. Enable it in your browser settings.' : 'Could not get location: ' + err.message, 5000);
    if (err.code === 1) stopGps();
    if (!gps.fix) setStatus(summary());
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
}
function stopGps() {
  if (gps.watchId != null) navigator.geolocation.clearWatch(gps.watchId);
  gps.watchId = null; gps.follow = false;
  if (map.hasLayer(meLayer)) map.removeLayer(meLayer);
  $('btnGps').classList.remove('on');
  setStatus(summary());
}
$('btnGps').addEventListener('click', () => {
  if (gps.watchId == null) { startGps(); gps.follow = true; $('btnGps').classList.add('on'); toast('Following your location. Drag the map to stop following.'); }
  else if (!gps.follow && gps.fix) { gps.follow = true; $('btnGps').classList.add('on'); map.setView([gps.fix.lat, gps.fix.lon], Math.max(map.getZoom(), 15)); }
  else stopGps();
});
map.on('dragstart', () => { if (gps.follow) { gps.follow = false; $('btnGps').classList.remove('on'); } });

  $('segBase').addEventListener('click', (e) => {

const byDistance = (a, b) => gps.fix ? haversine(gps.fix, a) - haversine(gps.fix, b) : byRating(a, b);

      || plainName(p.kind + ' ' + p.area + ' ' + (p.notes || '')).includes(plainName(q)))).map((p) =>
      `<li data-i="${items.indexOf(p)}"><span>${GROUPS[p.group].icon}</span><span class="nm"><b>${escapeHtml(p.name)}</b><span class="small">${escapeHtml(p.kind)} · ${escapeHtml(p.area)}${p.openNow != null ? (p.openNow ? ' · <span style="color:#5be38a">open</span>' : ' · <span style="color:#ff8a8a">closed</span>') : ''}</span></span>`
      + `<span class="km">${p.rating != null ? ratingBadge(p) + '<br>' : ''}${gps.fix ? fmtKm(haversine(gps.fix, p)) : ''}</span><button class="pill go" data-go="${items.indexOf(p)}" title="Route here">🧭</button></li>`).join('');
  };
  openSheet(`${listTabs(tab)}<div class="row">${sortSeg()}${tab === 'food' ? `<div class="seg" id="grp"><button data-v="all" class="on">All</button>
    ${FOOD.map((k) => `<button data-v="${k}">${GROUPS[k].label}</button>`).join('')}</div>` : ''}</div>
    <input type="search" id="q" placeholder="Search name, cuisine, neighbourhood…"><ul class="list" id="tl"></ul>
    ${gps.fix ? '' : '<div class="small" style="margin-top:6px">Turn on location (bottom-right button) to sort by distance and route from where you are.</div>'}
    ${googleKey() || tab === 'sights' ? '' : '<div class="small" style="margin-top:6px">Tip: add a Google API key in Layers to see ratings.</div>'}`);
  $('listTabs').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.v; if (v) showList(v); });
  $('tl').innerHTML = render();
  $('q').addEventListener('input', () => { $('tl').innerHTML = render(); });
  $('sortSeg').addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (!v) return;
    if (v === 'distance' && !gps.fix) { startGps(); gps.follow = false; toast('Finding your location to sort by distance…'); }
    settings.sort = v; saveSettings(); items = sorted();
    for (const b of $('sortSeg').children) b.classList.toggle('on', b.dataset.v === v);
    $('tl').innerHTML = render();
  });
  $('grp')?.addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (!v) return; group = v;
    for (const b of $('grp').children) b.classList.toggle('on', b.dataset.v === v);
    $('tl').innerHTML = render();
  });
  $('tl').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { startNavigation(items[+go.dataset.go]); return; }
    const li = e.target.closest('li'); if (li) selectPlace(items[+li.dataset.i]);
  });
}
$('btnList').addEventListener('click', () => showList(listTab));

// ---------------------------------------------------------------------------
// Loading sequence
// ---------------------------------------------------------------------------
const summary = () => {
  const rated = places.filter((p) => p.rating != null).length;
  return `${places.filter((p) => p.group === 'market').length} markets · ${places.filter((p) => FOOD.includes(p.group)).length} places to eat & drink`
    + (rated ? ` · ${rated} rated` : '');
};

async function main() {
  $('loadmsg').textContent = 'Loading places…';
  const res = await fetch('data/places.json');
  if (!res.ok) throw new Error('places.json ' + res.status);
  places = (await res.json()).places;
  updateReviewScale();
  buildMarkers();
  setStatus(summary());
  $('loading').classList.add('hide');
  // Ratings load in the background; the map is usable meanwhile.
  loadRatings();
  // Start the GPS straight away when the user has already granted permission.
  try {
    const st = await navigator.permissions?.query({ name: 'geolocation' });
    if (st?.state === 'granted') { startGps(); gps.follow = true; $('btnGps').classList.add('on'); }
  } catch {}
}
main().catch((e) => { console.error(e); $('loadmsg').textContent = 'Failed to load: ' + e.message; });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e)));
}
</script>
</body>
</html>
